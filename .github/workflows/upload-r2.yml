name: Upload R2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to upload to R2, for example v0.4.8
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    name: Upload release assets to R2
    runs-on: ubuntu-latest

    steps:
      - name: Resolve R2 public base URL
        id: r2_config
        env:
          NAVOP_PUBLIC_BASE_URL: ${{ vars.NAVOP_PUBLIC_BASE_URL }}
        run: |
          base_url="${NAVOP_PUBLIC_BASE_URL%/}"
          if [ -z "$base_url" ]; then
            echo "::warning::NAVOP_PUBLIC_BASE_URL repo variable is not set; skipping R2 upload. GitHub Release remains the fallback source."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release
        if: ${{ steps.r2_config.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          release_tag="$INPUT_TAG"

          if [ -z "$release_tag" ]; then
            echo "::warning::Release tag is empty; skipping R2 upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Show R2 upload target
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        run: |
          echo "Release tag: ${{ steps.release.outputs.tag }}"
          echo "R2 public base URL: ${{ steps.r2_config.outputs.base_url }}"

      - name: Check out release tag
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Extract release notes from changelog
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -f CHANGELOG.md ] && [ -f script/changelog.py ]; then
            python3 script/changelog.py extract \
              --tag "$RELEASE_TAG" \
              --changelog CHANGELOG.md \
              --output artifacts/release-notes.md
          else
            echo "::warning::${RELEASE_TAG} predates the tracked changelog; using its existing GitHub Release body for this legacy R2 synchronization."
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq .body > artifacts/release-notes.md
          fi
          if [ ! -s artifacts/release-notes.md ]; then
            echo "::error::Release notes for ${RELEASE_TAG} are empty"
            exit 1
          fi

      - name: Verify R2 secrets are set
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} secret is empty or not set"
              exit 1
            fi
          done

      - name: Download GitHub Release assets
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "navop-*" \
            --pattern "navop_*" \
            --pattern "sha256sums.txt" \
            --dir artifacts
          ls -la artifacts

      - name: Verify downloaded release assets
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          test -s artifacts/sha256sums.txt
          shopt -s nullglob
          release_files=(artifacts/navop-* artifacts/navop_*)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "::error::No Navop package assets were downloaded"
            exit 1
          fi
          for path in "${release_files[@]}"; do
            file="${path#artifacts/}"
            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty GitHub Release asset: ${file}"
              exit 1
            fi
            if ! awk -v file="$file" '$2 == file && $1 ~ /^[0-9a-f]{64}$/ { found = 1 } END { exit found ? 0 : 1 }' artifacts/sha256sums.txt; then
              echo "::error::sha256sums.txt is missing checksum for ${file}"
              exit 1
            fi
          done

      - name: Generate R2 update manifest
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          NAVOP_PUBLIC_BASE_URL: ${{ steps.r2_config.outputs.base_url }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const baseUrl = process.env.NAVOP_PUBLIC_BASE_URL.replace(/\/+$/, "");
          const releaseTag = process.env.RELEASE_TAG;
          const version = process.env.RELEASE_VERSION;
          const repository = process.env.GITHUB_REPOSITORY;
          if (!repository) throw new Error("GITHUB_REPOSITORY is required");
          const releaseNotes = fs
            .readFileSync("artifacts/release-notes.md", "utf8")
            .trim();
          if (!releaseNotes) throw new Error("release notes are empty");
          const checksums = new Map(
            fs
              .readFileSync("artifacts/sha256sums.txt", "utf8")
              .trim()
              .split(/\n/)
              .filter(Boolean)
              .map((line) => {
                const [sha256, fileName] = line.trim().split(/\s+/, 2);
                return [fileName, sha256];
              }),
          );

          const updaterAssets = {
            "aarch64-apple-darwin": "navop-aarch64-apple-darwin.tar.gz",
            "x86_64-apple-darwin": "navop-x86_64-apple-darwin.tar.gz",
            "x86_64-unknown-linux-gnu": "navop-x86_64-unknown-linux-gnu.tar.gz",
            "x86_64-pc-windows-msvc": "navop-x86_64-pc-windows-msvc.zip",
            "i686-pc-windows-msvc": "navop-i686-pc-windows-msvc.zip",
          };
          if (fs.existsSync("artifacts/navop-aarch64-unknown-linux-gnu.tar.gz")) {
            updaterAssets["aarch64-unknown-linux-gnu"] = "navop-aarch64-unknown-linux-gnu.tar.gz";
          }

          function checksumFor(fileName) {
            const sha256 = checksums.get(fileName);
            if (!sha256) throw new Error(`missing checksum for ${fileName}`);
            return sha256;
          }

          function objectUrls(prefix, assets) {
            return Object.fromEntries(
              Object.entries(assets).map(([target, fileName]) => [
                target,
                `${baseUrl}/${prefix}/${releaseTag}/${fileName}`,
              ]),
            );
          }

          function objectChecksums(assets) {
            return Object.fromEntries(
              Object.entries(assets).map(([target, fileName]) => [
                target,
                checksumFor(fileName),
              ]),
            );
          }

          function githubReleaseUrls(assets) {
            return Object.fromEntries(
              Object.entries(assets).map(([target, fileName]) => [
                target,
                `https://github.com/${repository}/releases/download/${releaseTag}/${fileName}`,
              ]),
            );
          }

          function targetFor(fileName) {
            const publicTargets = [
              ["macos-arm64", "aarch64-apple-darwin"],
              ["macos-x64", "x86_64-apple-darwin"],
              ["linux-x64-portable", "x86_64-unknown-linux-gnu"],
              ["linux-arm64-portable", "aarch64-unknown-linux-gnu"],
              ["linux-x64", "x86_64-unknown-linux-gnu"],
              ["linux-arm64", "aarch64-unknown-linux-gnu"],
              ["windows-x64", "x86_64-pc-windows-msvc"],
              ["win32", "i686-pc-windows-msvc"],
            ];
            const publicTarget = publicTargets.find(([label]) => fileName.includes(`-${label}.`) || fileName.includes(`-${label}-portable.`));
            if (publicTarget) return fileName.includes("-portable.") ? `${publicTarget[1]}-portable` : publicTarget[1];
            const knownTargets = [
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
              "x86_64-pc-windows-msvc",
              "i686-pc-windows-msvc",
            ];
            const target = knownTargets.find((candidate) => fileName.includes(candidate));
            if (target) return fileName.includes("-portable.") ? `${target}-portable` : target;
            if (/_(?:[^_]+)_amd64\.(?:deb|AppImage)$/.test(fileName) || /\.x86_64\.rpm$/.test(fileName)) {
              return "x86_64-unknown-linux-gnu";
            }
            return "universal";
          }

          const publicUpdaterAlternatives = new Map([
            ["navop-aarch64-apple-darwin.tar.gz", `navop-${version}-macos-arm64.tar.gz`],
            ["navop-x86_64-apple-darwin.tar.gz", `navop-${version}-macos-x64.tar.gz`],
            ["navop-x86_64-unknown-linux-gnu.tar.gz", `navop-${version}-linux-x64.tar.gz`],
            ["navop-aarch64-unknown-linux-gnu.tar.gz", `navop-${version}-linux-arm64.tar.gz`],
            ["navop-x86_64-pc-windows-msvc.zip", `navop-${version}-windows-x64.zip`],
            ["navop-i686-pc-windows-msvc.zip", `navop-${version}-win32.zip`],
          ]);
          const availableFiles = new Set(fs.readdirSync("artifacts"));
          const packageFiles = [...availableFiles]
            .filter((fileName) => /^navop[-_]/.test(fileName))
            .filter((fileName) => {
              const alternative = publicUpdaterAlternatives.get(fileName);
              return !alternative || !availableFiles.has(alternative);
            })
            .sort();
          const packages = packageFiles.map((fileName) => ({
            target: targetFor(fileName),
            file: fileName,
            url: `${baseUrl}/releases/${releaseTag}/${fileName}`,
            github_url: `https://github.com/${repository}/releases/download/${releaseTag}/${fileName}`,
            sha256: checksumFor(fileName),
            size: fs.statSync(`artifacts/${fileName}`).size,
          }));

          fs.mkdirSync("artifacts/updates", { recursive: true });
          fs.writeFileSync(
            "artifacts/updates/latest.json",
            `${JSON.stringify(
              {
                schema_version: 1,
                version,
                release_page_url: `${baseUrl}/releases/${releaseTag}/`,
                release_notes: releaseNotes,
                downloads: objectUrls("releases", updaterAssets),
                fallback_downloads: githubReleaseUrls(updaterAssets),
                sha256s: objectChecksums(updaterAssets),
                packages,
              },
              null,
              2,
            )}\n`,
          );
          NODE

      - name: Upload update archives and manifest to R2
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          upload_object() {
            local source="$1"
            local key="$2"
            local content_type="$3"
            local cache_control="$4"
            local expected_size
            local expected_sha256
            local head_json
            local actual_size
            local actual_sha256
            local actual_cache_control

            expected_size="$(wc -c < "$source" | tr -d '[:space:]')"
            expected_sha256="$(sha256sum "$source" | awk '{print $1}')"

            aws s3 cp "$source" "s3://${CLOUDFLARE_R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint" \
              --content-type "$content_type" \
              --cache-control "$cache_control" \
              --metadata "sha256=${expected_sha256}"

            head_json="$(
              aws s3api head-object \
                --bucket "$CLOUDFLARE_R2_BUCKET" \
                --key "$key" \
                --endpoint-url "$endpoint" \
                --output json
            )"
            actual_size="$(jq -r '.ContentLength' <<< "$head_json")"
            actual_sha256="$(jq -r '.Metadata.sha256 // empty' <<< "$head_json")"
            actual_cache_control="$(jq -r '.CacheControl // empty' <<< "$head_json")"

            if [ "$actual_size" != "$expected_size" ]; then
              echo "::error::R2 object size mismatch for ${key}: expected ${expected_size}, got ${actual_size}"
              exit 1
            fi
            if [ "$actual_sha256" != "$expected_sha256" ]; then
              echo "::error::R2 object checksum metadata mismatch for ${key}"
              exit 1
            fi
            if [ "$actual_cache_control" != "$cache_control" ]; then
              echo "::error::R2 object cache-control mismatch for ${key}: expected '${cache_control}', got '${actual_cache_control}'"
              exit 1
            fi

            echo "Verified R2 object: ${key} (${actual_size} bytes, sha256=${actual_sha256})"
          }

          shopt -s nullglob
          release_files=(artifacts/navop-* artifacts/navop_*)
          for path in "${release_files[@]}"; do
            file="${path#artifacts/}"
            case "$file" in
              *.tar.gz) content_type="application/gzip" ;;
              *.zip) content_type="application/zip" ;;
              *.dmg) content_type="application/x-apple-diskimage" ;;
              *.msi) content_type="application/x-msi" ;;
              *.exe) content_type="application/vnd.microsoft.portable-executable" ;;
              *.deb) content_type="application/vnd.debian.binary-package" ;;
              *.rpm) content_type="application/x-rpm" ;;
              *.AppImage) content_type="application/octet-stream" ;;
              *) content_type="application/octet-stream" ;;
            esac
            # Release repair workflows may replace an object under the same tag
            # and filename, so these URLs must be revalidated instead of cached
            # as immutable for a year.
            upload_object "$path" "releases/${RELEASE_TAG}/${file}" "$content_type" "public, max-age=0, must-revalidate"
          done

          upload_object "artifacts/updates/latest.json" "updates/latest.json" "application/json; charset=utf-8" "no-store, max-age=0"
