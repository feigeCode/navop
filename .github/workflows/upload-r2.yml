name: Upload R2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to upload to R2, for example v0.4.8
        required: true
        type: string
      channel:
        description: 发布通道 stable 或 beta；留空则从 tag 自动推导（稳定 tag → stable，其余 → beta）
        required: false
        default: ""
        type: string

# actions: write 用于在最后派发 sync-cnb-release-assets.yml；contents: write
# 用于把更新清单以 feed-*.json 资产名回写到本次 GitHub Release（CNB 镜像只
# 同步 Release 资产，这是 CNB 侧唯一能匿名直接 GET 的清单位置）。
permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    name: Upload release assets to R2
    runs-on: ubuntu-latest

    steps:
      - name: Resolve R2 public base URL
        id: r2_config
        env:
          NAVOP_PUBLIC_BASE_URL: ${{ vars.NAVOP_PUBLIC_BASE_URL }}
        run: |
          base_url="${NAVOP_PUBLIC_BASE_URL%/}"
          if [ -z "$base_url" ]; then
            echo "::warning::NAVOP_PUBLIC_BASE_URL repo variable is not set; skipping R2 upload. GitHub Release remains the fallback source."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release
        if: ${{ steps.r2_config.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          release_tag="$INPUT_TAG"

          if [ -z "$release_tag" ]; then
            echo "::warning::Release tag is empty; skipping R2 upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 发布通道：显式传入优先；留空则按 tag 推导。规则与 release.yml 的
          # prepare job 一字不差——纯稳定版本号是 stable，预发布一律 beta。
          CHANNEL="${INPUT_CHANNEL:-}"
          if [ -z "$CHANNEL" ]; then
            if [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then CHANNEL=stable; else CHANNEL=beta; fi
          fi
          case "$CHANNEL" in
            stable|beta) ;;
            *)
              echo "::error::Invalid channel '${CHANNEL}'; expected stable or beta"
              exit 1
              ;;
          esac

          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Show R2 upload target
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        run: |
          echo "Release tag: ${{ steps.release.outputs.tag }}"
          echo "Release channel: ${{ steps.release.outputs.channel }}"
          echo "R2 public base URL: ${{ steps.r2_config.outputs.base_url }}"

      - name: Check out release tag
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Extract release notes from changelog
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [ -f CHANGELOG.md ] && [ -f script/changelog.py ]; then
            python3 script/changelog.py extract \
              --tag "$RELEASE_TAG" \
              --changelog CHANGELOG.md \
              --output artifacts/release-notes.md
          else
            echo "::warning::${RELEASE_TAG} predates the tracked changelog; using its existing GitHub Release body for this legacy R2 synchronization."
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq .body > artifacts/release-notes.md
          fi
          if [ ! -s artifacts/release-notes.md ]; then
            echo "::error::Release notes for ${RELEASE_TAG} are empty"
            exit 1
          fi

      - name: Verify R2 secrets are set
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} secret is empty or not set"
              exit 1
            fi
          done

      - name: Download GitHub Release assets
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "navop-*" \
            --pattern "navop_*" \
            --pattern "sha256sums.txt" \
            --dir artifacts
          ls -la artifacts

      - name: Verify downloaded release assets
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          test -s artifacts/sha256sums.txt
          shopt -s nullglob
          release_files=(artifacts/navop-* artifacts/navop_*)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "::error::No Navop package assets were downloaded"
            exit 1
          fi
          for path in "${release_files[@]}"; do
            file="${path#artifacts/}"
            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty GitHub Release asset: ${file}"
              exit 1
            fi
            if ! awk -v file="$file" '$2 == file && $1 ~ /^[0-9a-f]{64}$/ { found = 1 } END { exit found ? 0 : 1 }' artifacts/sha256sums.txt; then
              echo "::error::sha256sums.txt is missing checksum for ${file}"
              exit 1
            fi
          done

      - name: Generate R2 update manifest
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          NAVOP_PUBLIC_BASE_URL: ${{ steps.r2_config.outputs.base_url }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const baseUrl = process.env.NAVOP_PUBLIC_BASE_URL.replace(/\/+$/, "");
          const releaseTag = process.env.RELEASE_TAG;
          const version = process.env.RELEASE_VERSION;
          const repository = process.env.GITHUB_REPOSITORY;
          if (!repository) throw new Error("GITHUB_REPOSITORY is required");
          const releaseNotes = fs
            .readFileSync("artifacts/release-notes.md", "utf8")
            .trim();
          if (!releaseNotes) throw new Error("release notes are empty");
          const checksums = new Map(
            fs
              .readFileSync("artifacts/sha256sums.txt", "utf8")
              .trim()
              .split(/\n/)
              .filter(Boolean)
              .map((line) => {
                const [sha256, fileName] = line.trim().split(/\s+/, 2);
                return [fileName, sha256];
              }),
          );

          // 统一 tag 发布三个产品：每个产品各生成一份清单，指向各自的
          // updater 资产（{binary}-{target} 命名）与各自的公开安装包。
          // 全量的清单键位由上传步骤按 channel 落位（updates/latest.json
          // 或 updates/beta/latest.json）；独立产品键位为
          // updates/{binary}/{mcp_update_channel}[/beta]/latest.json，
          // 与 crates/app_kit/src/update/config.rs 的 feed_url() 推导一致。
          const products = [
            {
              id: "navop",
              prefix: "navop-",
              updaterAssets: {
                "aarch64-apple-darwin": "navop-aarch64-apple-darwin.tar.gz",
                "x86_64-apple-darwin": "navop-x86_64-apple-darwin.tar.gz",
                "x86_64-unknown-linux-gnu": "navop-x86_64-unknown-linux-gnu.tar.gz",
                "x86_64-pc-windows-msvc": "navop-x86_64-pc-windows-msvc.zip",
                "i686-pc-windows-msvc": "navop-i686-pc-windows-msvc.zip",
              },
              manifestPath: "artifacts/updates/latest.json",
            },
            {
              id: "navop-shell",
              prefix: "navop-shell-",
              updaterAssets: {
                "aarch64-apple-darwin": "navop-shell-aarch64-apple-darwin.tar.gz",
                "x86_64-apple-darwin": "navop-shell-x86_64-apple-darwin.tar.gz",
                "x86_64-unknown-linux-gnu": "navop-shell-x86_64-unknown-linux-gnu.tar.gz",
                "x86_64-pc-windows-msvc": "navop-shell-x86_64-pc-windows-msvc.zip",
              },
              manifestPath: "artifacts/updates/navop-shell/shell/latest.json",
            },
            {
              id: "navop-data",
              prefix: "navop-data-",
              updaterAssets: {
                "aarch64-apple-darwin": "navop-data-aarch64-apple-darwin.tar.gz",
                "x86_64-apple-darwin": "navop-data-x86_64-apple-darwin.tar.gz",
                "x86_64-unknown-linux-gnu": "navop-data-x86_64-unknown-linux-gnu.tar.gz",
                "x86_64-pc-windows-msvc": "navop-data-x86_64-pc-windows-msvc.zip",
              },
              manifestPath: "artifacts/updates/navop-data/data/latest.json",
            },
          ];
          if (fs.existsSync("artifacts/navop-aarch64-unknown-linux-gnu.tar.gz")) {
            products[0].updaterAssets["aarch64-unknown-linux-gnu"] =
              "navop-aarch64-unknown-linux-gnu.tar.gz";
          }

          function checksumFor(fileName) {
            const sha256 = checksums.get(fileName);
            if (!sha256) throw new Error(`missing checksum for ${fileName}`);
            return sha256;
          }

          function objectUrls(prefix, assets) {
            return Object.fromEntries(
              Object.entries(assets).map(([target, fileName]) => [
                target,
                `${baseUrl}/${prefix}/${releaseTag}/${fileName}`,
              ]),
            );
          }

          function objectChecksums(assets) {
            return Object.fromEntries(
              Object.entries(assets).map(([target, fileName]) => [
                target,
                checksumFor(fileName),
              ]),
            );
          }

          function githubReleaseUrls(assets) {
            return Object.fromEntries(
              Object.entries(assets).map(([target, fileName]) => [
                target,
                `https://github.com/${repository}/releases/download/${releaseTag}/${fileName}`,
              ]),
            );
          }

          function targetFor(fileName) {
            const publicTargets = [
              ["macos-arm64", "aarch64-apple-darwin"],
              ["macos-x64", "x86_64-apple-darwin"],
              ["linux-x64", "x86_64-unknown-linux-gnu"],
              ["linux-arm64", "aarch64-unknown-linux-gnu"],
              ["windows-x64", "x86_64-pc-windows-msvc"],
              ["win32", "i686-pc-windows-msvc"],
            ];
            // The portable variants and the Linux GPU dependency stack are
            // published next to the app archive as extra assets for the same
            // target, so they have to map onto that target instead of falling
            // through to "universal".
            const publicTarget = publicTargets.find(
              ([label]) =>
                fileName.includes(`-${label}.`) ||
                fileName.includes(`-${label}-portable.`) ||
                fileName.includes(`-${label}-gpu-stack.`),
            );
            if (publicTarget) {
              if (fileName.includes("-portable.")) {
                return `${publicTarget[1]}-portable`;
              }
              if (fileName.includes("-gpu-stack.")) {
                return `${publicTarget[1]}-gpu-stack`;
              }
              return publicTarget[1];
            }
            const knownTargets = [
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
              "x86_64-pc-windows-msvc",
              "i686-pc-windows-msvc",
            ];
            const target = knownTargets.find((candidate) => fileName.includes(candidate));
            if (target) return target;
            if (/_(?:[^_]+)_amd64\.(?:deb|AppImage)$/.test(fileName) || /\.x86_64\.rpm$/.test(fileName)) {
              return "x86_64-unknown-linux-gnu";
            }
            return "universal";
          }

          const availableFiles = new Set(fs.readdirSync("artifacts"));
          // updater 资产（{binary}-{target} 命名）与公开安装包
          // （{product}-{version}-{label} 命名）同时存在时，packages 列表只
          // 保留公开命名那份；独立产品没有替代对，全部文件都进列表。
          const publicUpdaterAlternatives = new Map([
            ["navop-aarch64-apple-darwin.tar.gz", `navop-${version}-macos-arm64.tar.gz`],
            ["navop-x86_64-apple-darwin.tar.gz", `navop-${version}-macos-x64.tar.gz`],
            ["navop-x86_64-unknown-linux-gnu.tar.gz", `navop-${version}-linux-x64.tar.gz`],
            ["navop-aarch64-unknown-linux-gnu.tar.gz", `navop-${version}-linux-arm64.tar.gz`],
            ["navop-x86_64-pc-windows-msvc.zip", `navop-${version}-windows-x64.zip`],
            ["navop-i686-pc-windows-msvc.zip", `navop-${version}-win32.zip`],
            [`navop-shell-aarch64-apple-darwin.tar.gz`, `navop-shell-${version}-macos-arm64.tar.gz`],
            [`navop-shell-x86_64-apple-darwin.tar.gz`, `navop-shell-${version}-macos-x64.tar.gz`],
            [`navop-shell-x86_64-unknown-linux-gnu.tar.gz`, `navop-shell-${version}-linux-x64.tar.gz`],
            [`navop-shell-x86_64-pc-windows-msvc.zip`, `navop-shell-${version}-windows-x64.zip`],
            [`navop-data-aarch64-apple-darwin.tar.gz`, `navop-data-${version}-macos-arm64.tar.gz`],
            [`navop-data-x86_64-apple-darwin.tar.gz`, `navop-data-${version}-macos-x64.tar.gz`],
            [`navop-data-x86_64-unknown-linux-gnu.tar.gz`, `navop-data-${version}-linux-x64.tar.gz`],
            [`navop-data-x86_64-pc-windows-msvc.zip`, `navop-data-${version}-windows-x64.zip`],
          ]);
          const packageFiles = [...availableFiles]
            .filter((fileName) => /^navop[-_]/.test(fileName))
            .filter((fileName) => {
              const alternative = publicUpdaterAlternatives.get(fileName);
              return !alternative || !availableFiles.has(alternative);
            })
            .sort();
          const packages = packageFiles.map((fileName) => ({
            target: targetFor(fileName),
            file: fileName,
            url: `${baseUrl}/releases/${releaseTag}/${fileName}`,
            github_url: `https://github.com/${repository}/releases/download/${releaseTag}/${fileName}`,
            sha256: checksumFor(fileName),
            size: fs.statSync(`artifacts/${fileName}`).size,
          }));

          fs.mkdirSync("artifacts/updates", { recursive: true });
          for (const product of products) {
            const manifest = {
              schema_version: 1,
              version,
              release_page_url: `${baseUrl}/releases/${releaseTag}/`,
              release_notes: releaseNotes,
              downloads: objectUrls("releases", product.updaterAssets),
              fallback_downloads: githubReleaseUrls(product.updaterAssets),
              sha256s: objectChecksums(product.updaterAssets),
              packages,
            };
            fs.mkdirSync(product.manifestPath.replace(/\/[^/]+$/, ""), { recursive: true });
            fs.writeFileSync(
              product.manifestPath,
              `${JSON.stringify(manifest, null, 2)}\n`,
            );
            console.log(`Wrote ${product.manifestPath}`);
          }
          NODE

      - name: Upload update archives and manifest to R2
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # 更新清单按通道落位：stable 继续写 updates/latest.json（老客户端唯一
          # 认识的位置），beta 只写 updates/beta/latest.json，绝不能覆盖稳定清单。
          # 独立产品清单键位 updates/{binary}/{mcp_update_channel}[/beta]/latest.json
          # 与 crates/app_kit/src/update/config.rs 的 feed_url() 保持一致。
          case "${CHANNEL}" in
            stable)
              manifest_key="updates/latest.json"
              shell_manifest_key="updates/navop-shell/shell/latest.json"
              data_manifest_key="updates/navop-data/data/latest.json"
              ;;
            beta)
              manifest_key="updates/beta/latest.json"
              shell_manifest_key="updates/navop-shell/shell/beta/latest.json"
              data_manifest_key="updates/navop-data/data/beta/latest.json"
              ;;
            *)
              echo "::error::Unsupported release channel: ${CHANNEL:-<empty>}"
              exit 1
              ;;
          esac
          echo "Release channel ${CHANNEL}; update manifest key: ${manifest_key}"

          upload_object() {
            local source="$1"
            local key="$2"
            local content_type="$3"
            local cache_control="$4"
            local expected_size
            local expected_sha256
            local head_json
            local actual_size
            local actual_sha256
            local actual_cache_control

            expected_size="$(wc -c < "$source" | tr -d '[:space:]')"
            expected_sha256="$(sha256sum "$source" | awk '{print $1}')"

            aws s3 cp "$source" "s3://${CLOUDFLARE_R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint" \
              --content-type "$content_type" \
              --cache-control "$cache_control" \
              --metadata "sha256=${expected_sha256}"

            head_json="$(
              aws s3api head-object \
                --bucket "$CLOUDFLARE_R2_BUCKET" \
                --key "$key" \
                --endpoint-url "$endpoint" \
                --output json
            )"
            actual_size="$(jq -r '.ContentLength' <<< "$head_json")"
            actual_sha256="$(jq -r '.Metadata.sha256 // empty' <<< "$head_json")"
            actual_cache_control="$(jq -r '.CacheControl // empty' <<< "$head_json")"

            if [ "$actual_size" != "$expected_size" ]; then
              echo "::error::R2 object size mismatch for ${key}: expected ${expected_size}, got ${actual_size}"
              exit 1
            fi
            if [ "$actual_sha256" != "$expected_sha256" ]; then
              echo "::error::R2 object checksum metadata mismatch for ${key}"
              exit 1
            fi
            if [ "$actual_cache_control" != "$cache_control" ]; then
              echo "::error::R2 object cache-control mismatch for ${key}: expected '${cache_control}', got '${actual_cache_control}'"
              exit 1
            fi

            echo "Verified R2 object: ${key} (${actual_size} bytes, sha256=${actual_sha256})"
          }

          shopt -s nullglob
          release_files=(artifacts/navop-* artifacts/navop_*)
          for path in "${release_files[@]}"; do
            file="${path#artifacts/}"
            case "$file" in
              *.tar.gz) content_type="application/gzip" ;;
              *.zip) content_type="application/zip" ;;
              *.dmg) content_type="application/x-apple-diskimage" ;;
              *.msi) content_type="application/x-msi" ;;
              *.exe) content_type="application/vnd.microsoft.portable-executable" ;;
              *.deb) content_type="application/vnd.debian.binary-package" ;;
              *.rpm) content_type="application/x-rpm" ;;
              *.AppImage) content_type="application/octet-stream" ;;
              *) content_type="application/octet-stream" ;;
            esac
            # Release repair workflows may replace an object under the same tag
            # and filename, so these URLs must be revalidated instead of cached
            # as immutable for a year.
            upload_object "$path" "releases/${RELEASE_TAG}/${file}" "$content_type" "public, max-age=0, must-revalidate"
          done

          upload_object "artifacts/updates/latest.json" "${manifest_key}" "application/json; charset=utf-8" "no-store, max-age=0"
          upload_object "artifacts/updates/navop-shell/shell/latest.json" "${shell_manifest_key}" "application/json; charset=utf-8" "no-store, max-age=0"
          upload_object "artifacts/updates/navop-data/data/latest.json" "${data_manifest_key}" "application/json; charset=utf-8" "no-store, max-age=0"

          # 稳定发布时把同一份稳定清单再写一遍 beta 键位。原因：beta 客户端只
          # 读 beta 清单，不写这里它就永远停在最后一个 beta，收不到新的正式版。
          # stable 自己的两个键位（上面的 ${manifest_key} 等）原有写入不动。
          if [ "${CHANNEL}" = "stable" ]; then
            upload_object "artifacts/updates/latest.json" "updates/beta/latest.json" "application/json; charset=utf-8" "no-store, max-age=0"
            upload_object "artifacts/updates/navop-shell/shell/latest.json" "updates/navop-shell/shell/beta/latest.json" "application/json; charset=utf-8" "no-store, max-age=0"
            upload_object "artifacts/updates/navop-data/data/latest.json" "updates/navop-data/data/beta/latest.json" "application/json; charset=utf-8" "no-store, max-age=0"
          fi

      # 更新清单同时以扁平资产名（feed-*.json）回写到本次 GitHub Release。
      # CNB 镜像（sync-cnb-release-assets.yml）只同步 GitHub Release 资产，CNB
      # 仓库文件的 raw 直链对匿名不可用，所以这些 Release 资产就是 CNB 侧唯一
      # 能直接 GET 的更新清单。
      - name: Publish update feed assets for mirrors
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/feed

          if [ "${CHANNEL}" = "stable" ]; then
            cp artifacts/updates/latest.json artifacts/feed/feed-navop.json
            cp artifacts/updates/navop-shell/shell/latest.json artifacts/feed/feed-navop-shell.json
            cp artifacts/updates/navop-data/data/latest.json artifacts/feed/feed-navop-data.json
            # 稳定通道额外发一份 feed-<product>-beta.json，内容与稳定清单完全
            # 相同。原因：beta 客户端只读 beta 清单/资产，不发这份它永远停在
            # 最后一个 beta，收不到新的正式版。
            cp artifacts/updates/latest.json artifacts/feed/feed-navop-beta.json
            cp artifacts/updates/navop-shell/shell/latest.json artifacts/feed/feed-navop-shell-beta.json
            cp artifacts/updates/navop-data/data/latest.json artifacts/feed/feed-navop-data-beta.json
          else
            # beta 通道只发 beta 命名的资产：不带 -beta 的稳定资产名属于稳定
            # Release，beta 不该占用它们。
            cp artifacts/updates/latest.json artifacts/feed/feed-navop-beta.json
            cp artifacts/updates/navop-shell/shell/latest.json artifacts/feed/feed-navop-shell-beta.json
            cp artifacts/updates/navop-data/data/latest.json artifacts/feed/feed-navop-data-beta.json
          fi

          ls -l artifacts/feed
          # --clobber：同一个 tag 的修复重跑要能覆盖上一次的 feed 资产。
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            artifacts/feed/*.json

      # 桶里只留这次上传的版本：旧安装包在 R2 上只占空间，下载入口都不依赖它们
      # —— updates/latest.json 只指向本次 tag，旧版本另有 GitHub Release 与 CNB
      # 镜像作为存档。这一步必须待在上传与逐对象校验之后，且不能加 always()：
      # 上传没成功就一个对象都不许删，否则桶里可能新旧两份都不完整。
      - name: Prune older R2 releases
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # 所有删除都限定在这个前缀下：更新清单（latest.json 在另一条前缀里）
          # 永远不碰。
          prefix="releases"

          # 预发布（v0.20.0-rc.1 之类）不清理：它不该把上一个稳定版本的安装包
          # 带走，而它的对象本来也只是临时放一下。
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::Skipping R2 prune for non-stable release tag '${RELEASE_TAG}'."
            exit 0
          fi

          # 列出 releases/ 下的版本前缀（delimiter 让每页只回顶层目录名）。
          # 注意：--output text 对扁平列表是「一行、tab 拼接」，所以先用 tr 把它
          # 归一成一行一个，再用 ^...$ 锚定就对了；多页时同样是每行一个值。
          list_release_prefixes() {
            aws s3api list-objects-v2 \
              --bucket "${CLOUDFLARE_R2_BUCKET}" \
              --prefix "${prefix}/" \
              --delimiter "/" \
              --endpoint-url "${endpoint}" \
              --query "CommonPrefixes[].Prefix" \
              --output text \
              | tr '\t' '\n' \
              | sed -n "s|^${prefix}/\\([^/]*\\)/\$|\\1|p" \
              | sort -u
          }

          tags="$(list_release_prefixes)"
          echo "Versions in ${prefix}: $(tr '\n' ' ' <<< "${tags}")"

          # 本次 tag 不在桶里就什么都不删：宁可留下旧版本，也不能在「新版本其实
          # 没上传成功」时把最后一份可用安装包清掉。
          if ! grep -Fxq "${RELEASE_TAG}" <<< "${tags}"; then
            echo "::error::Refusing to prune: ${prefix}/${RELEASE_TAG}/ is not present in R2"
            exit 1
          fi

          # 测试通道清单（updates/beta/latest.json）不受 prune 影响，但它指向的
          # 安装包就在 ${prefix}/ 下：删掉它会让 beta 用户点下载拿到 404。
          # 优先读清单里的 version 精确保留；读不到（首次 beta 之前、或对象不存在）
          # 就退回「保留版本号最大的一个 beta」。
          beta_manifest_key="updates/beta/latest.json"
          beta_manifest_path="$(mktemp)"
          keep_beta_tag=""
          if aws s3api get-object \
            --bucket "${CLOUDFLARE_R2_BUCKET}" \
            --key "${beta_manifest_key}" \
            --endpoint-url "${endpoint}" \
            "${beta_manifest_path}" >/dev/null 2>&1; then
            keep_beta_tag="$(jq -r '.version // empty' "${beta_manifest_path}" 2>/dev/null || true)"
          fi
          rm -f "${beta_manifest_path}"
          if [ -n "${keep_beta_tag}" ]; then
            # 清单里的 version 不带 v 前缀，桶里的目录前缀带。
            case "${keep_beta_tag}" in
              v*) ;;
              *) keep_beta_tag="v${keep_beta_tag}" ;;
            esac
          else
            keep_beta_tag="$(printf '%s\n' ${tags} | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-' | sort -V | tail -1 || true)"
          fi

          keep_tags=" ${RELEASE_TAG} "
          if [ -n "${keep_beta_tag}" ]; then
            keep_tags="${keep_tags}${keep_beta_tag} "
            echo "Keeping ${prefix}/${keep_beta_tag}/ for the beta channel manifest"
          fi

          # 注意这里的 for 依赖分词逐行遍历。
          for tag in ${tags}; do
            case "${keep_tags}" in
              *" ${tag} "*) continue ;;
            esac
            echo "Deleting ${prefix}/${tag}/"
            aws s3 rm "s3://${CLOUDFLARE_R2_BUCKET}/${prefix}/${tag}/" \
              --recursive \
              --endpoint-url "${endpoint}"
          done

          for tag in $(list_release_prefixes); do
            case "${keep_tags}" in
              *" ${tag} "*) ;;
              *)
                echo "::error::R2 still holds ${prefix}/${tag}/ after pruning"
                exit 1
                ;;
            esac
          done

          echo "R2 now keeps ${keep_tags}(under ${prefix}/)"

      # CNB 镜像只同步 GitHub Release 资产，所以必须先有上一步回写的 feed-*.json
      # 资产再同步，否则 CNB 侧拿不到可直接 GET 的更新清单。派发原先在
      # release.yml 末尾，与本 workflow 并发，可能在 feed 资产就位之前就跑完；
      # 现在挪到这里，顺序有保证。
      - name: Dispatch CNB release asset sync
        if: ${{ steps.r2_config.outputs.skip != 'true' && steps.release.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run sync-cnb-release-assets.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$RELEASE_TAG"
