name: ai-spam-comments

on:
  # 自动触发暂时停用，只保留手动运行；恢复时取消下面注释。
  # issue_comment:
  #   types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  delete-spam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout filter rules
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/ai
          sparse-checkout-cone-mode: false

      - name: Delete suspected malware spam
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('node:path');
            const { detectSpamComment } = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts/ai/spam-filter.cjs')
            );
            const comment = context.payload.comment;
            const result = detectSpamComment({
              body: comment.body || '',
              authorAssociation: comment.author_association,
              userType: comment.user && comment.user.type,
            });
            core.info(JSON.stringify(result, null, 2));
            if (!result.spam) {
              core.info('comment did not match the spam filter');
              return;
            }
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
            });
            core.notice(
              `Deleted suspected spam comment by @${comment.user.login}: ${result.reasons.join('; ')}`
            );
