name: Build Windows installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version to build, for example 0.8.8"
        required: true
        type: string
      architecture:
        description: "Windows architecture"
        required: true
        type: choice
        default: x64
        options:
          - x64
          - x86

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "7200"
  WINDOWS_TARGET: ${{ inputs.architecture == 'x86' && 'i686-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
  WINDOWS_WIX_ARCH: ${{ inputs.architecture == 'x86' && 'x86' || 'x64' }}
  WINDOWS_BASENAME: ${{ inputs.architecture == 'x86' && 'navop-i686-pc-windows-msvc' || 'navop-x86_64-pc-windows-msvc' }}

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use x.y.z format: $version"
          }
          "ONETCLI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ env.WINDOWS_TARGET }}
          cache: false

      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          $nasmDir = Join-Path $env:ProgramFiles "NASM"
          $nasmExe = Join-Path $nasmDir "nasm.exe"
          if (-not (Test-Path -LiteralPath $nasmExe -PathType Leaf)) {
            Write-Warning "Chocolatey did not install NASM; downloading the pinned upstream archive"
            $nasmVersion = "3.01"
            $nasmArchive = Join-Path $env:RUNNER_TEMP "nasm-$nasmVersion-win64.zip"
            $nasmExtractRoot = Join-Path $env:RUNNER_TEMP "nasm-$nasmVersion-win64"
            Invoke-WebRequest `
              -Uri "https://www.nasm.us/pub/nasm/releasebuilds/$nasmVersion/win64/nasm-$nasmVersion-win64.zip" `
              -OutFile $nasmArchive
            $expectedHash = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
            $actualHash = (Get-FileHash -LiteralPath $nasmArchive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "NASM archive checksum mismatch: expected $expectedHash, got $actualHash"
            }
            Expand-Archive -LiteralPath $nasmArchive -DestinationPath $nasmExtractRoot -Force
            $nasmDir = Join-Path $nasmExtractRoot "nasm-$nasmVersion"
            $nasmExe = Join-Path $nasmDir "nasm.exe"
            if (-not (Test-Path -LiteralPath $nasmExe -PathType Leaf)) {
              throw "NASM executable was not found at '$nasmExe'"
            }
          }
          $env:Path = "$nasmDir;$env:Path"
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          nasm -v

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Initialize sccache
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server
          sccache --zero-stats
          sccache --show-stats

      - name: Restore shared Cargo inputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: navop-cargo-inputs-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            navop-cargo-inputs-v1-${{ runner.os }}-
            release-cargo-inputs-${{ runner.os }}-${{ env.WINDOWS_TARGET }}-

      - name: Verify build secrets
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) {
            throw "SUPABASE_URL secret is empty or not set"
          }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ANON_KEY)) {
            throw "SUPABASE_ANON_KEY secret is empty or not set"
          }

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ env.WINDOWS_WIX_ARCH }}

      - name: Verify native Windows RDP integration
        shell: pwsh
        run: ./script/build-windows-rdp-probe.ps1 -Target "$env:WINDOWS_TARGET"

      - name: Build release binary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NAVOP_PUBLIC_BASE_URL: ${{ vars.NAVOP_PUBLIC_BASE_URL }}
          NAVOP_WEBSITE_BASE_URL: ${{ vars.NAVOP_WEBSITE_BASE_URL }}
          ONETCLI_TEAM_MANAGEMENT_URL_TEMPLATE: ${{ vars.ONETCLI_TEAM_MANAGEMENT_URL_TEMPLATE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCToolsInstallDir)) {
            throw "VCToolsInstallDir is not configured"
          }
          cargo build --release -p main --features windows-native-rdp --target $env:WINDOWS_TARGET

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Stage Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          New-Item -ItemType Directory -Force portable-package | Out-Null
          Copy-Item "target/$env:WINDOWS_TARGET/release/navop.exe" "package/navop.exe"
          Copy-Item "target/$env:WINDOWS_TARGET/release/navop.exe" "portable-package/navop.exe"
          Set-Content -Path "portable-package/navop.portable" -Value "" -NoNewline
          Compress-Archive -Path "package/*" -DestinationPath "${env:WINDOWS_BASENAME}.zip"
          Compress-Archive -Path "portable-package/*" -DestinationPath "${env:WINDOWS_BASENAME}-portable.zip"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          node script/generate-windows-license.mjs
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.UI.wixext/6.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/6.0.2

      - name: Build installers
        shell: pwsh
        run: |
          wix build installer/windows/navop.wxs `
            -ext WixToolset.UI.wixext `
            -culture en-US `
            -loc installer/windows/navop.wxl `
            -arch $env:WINDOWS_WIX_ARCH `
            -d Version="$env:MSI_VERSION" `
            -d SourceDir="${{ github.workspace }}\package" `
            -d IconPath="${{ github.workspace }}\resources\windows\navop.ico" `
            -out "${env:WINDOWS_BASENAME}.msi"
          wix build installer/windows/navop-bundle.wxs `
            -ext WixToolset.BootstrapperApplications.wixext `
            -arch $env:WINDOWS_WIX_ARCH `
            -d Version="$env:MSI_VERSION" `
            -d MsiPath="${{ github.workspace }}\${env:WINDOWS_BASENAME}.msi" `
            -d IconPath="${{ github.workspace }}\resources\windows\navop.ico" `
            -out "${env:WINDOWS_BASENAME}.exe"

      - name: Validate MSI metadata
        shell: pwsh
        run: |
          ./script/validate-windows-msi.ps1 `
            -Path "${env:WINDOWS_BASENAME}.msi" `
            -ExpectedLanguage 1033

      - name: Generate checksum
        shell: pwsh
        run: |
          $files = @(
            "${env:WINDOWS_BASENAME}.zip",
            "${env:WINDOWS_BASENAME}-portable.zip",
            "${env:WINDOWS_BASENAME}.exe",
            "${env:WINDOWS_BASENAME}.msi"
          )
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $checksums | Set-Content -Path "sha256sums-windows.txt"
          Get-Content "sha256sums-windows.txt"

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: navop-windows-${{ inputs.architecture }}-${{ inputs.version }}
          path: |
            ${{ env.WINDOWS_BASENAME }}.zip
            ${{ env.WINDOWS_BASENAME }}-portable.zip
            ${{ env.WINDOWS_BASENAME }}.exe
            ${{ env.WINDOWS_BASENAME }}.msi
            sha256sums-windows.txt
          if-no-files-found: error
          retention-days: 7
