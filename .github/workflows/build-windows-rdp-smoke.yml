name: Build Windows RDP smoke package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "7200"

jobs:
  build:
    name: Windows RDP smoke (x64)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ env.WINDOWS_TARGET }}
          cache: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Restore shared Cargo inputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: navop-rdp-smoke-cargo-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            navop-rdp-smoke-cargo-v1-${{ runner.os }}-
            navop-cargo-inputs-v1-${{ runner.os }}-

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile and test the native RDP host
        shell: pwsh
        run: |
          cargo test --locked `
            -p windows_rdp_host `
            --target $env:WINDOWS_TARGET

      - name: Build the minimal GPUI RDP smoke client
        shell: pwsh
        run: |
          cargo build --locked --release `
            -p gpui-rdp-smoke `
            --target $env:WINDOWS_TARGET

      - name: Stage smoke package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "navop-rdp-smoke"
          $archive = Join-Path $PWD "navop-rdp-smoke-x64.zip"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item `
            "target/$env:WINDOWS_TARGET/release/gpui-rdp-smoke.exe" `
            (Join-Path $stage "gpui-rdp-smoke.exe")
          Copy-Item `
            "tools/gpui-rdp-smoke/README.md" `
            (Join-Path $stage "README.md")
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  navop-rdp-smoke-x64.zip" |
            Set-Content -LiteralPath "sha256sums-windows-rdp-smoke.txt"

      - name: Show sccache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Upload smoke package
        uses: actions/upload-artifact@v4
        with:
          name: navop-windows-rdp-smoke-${{ github.sha }}
          path: |
            navop-rdp-smoke-x64.zip
            sha256sums-windows-rdp-smoke.txt
          if-no-files-found: error
          retention-days: 7
