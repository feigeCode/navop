# TEMPORARY workflow: compiles navop for Windows with the native RDP backend so
# the window-composition change gets a real MSVC/ATL build (the local macOS host
# cannot cross-compile crates/windows_rdp_host's C++ host).
#
# Delete this file once the run is green.
name: TMP windows native RDP build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build navop (windows-native-rdp)
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          $nasmDir = Join-Path $env:ProgramFiles "NASM"
          $nasmExe = Join-Path $nasmDir "nasm.exe"
          if (-not (Test-Path -LiteralPath $nasmExe -PathType Leaf)) {
            throw "NASM executable was not found at '$nasmExe'"
          }
          $env:Path = "$nasmDir;$env:Path"
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          nasm -v
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
          cache: false
      - name: Restore shared Cargo inputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: navop-cargo-inputs-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            navop-cargo-inputs-v1-${{ runner.os }}-
            release-cargo-inputs-${{ runner.os }}-x86_64-pc-windows-msvc-
      - name: Build with the native RDP backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }
          $installationPath = & $vswhere `
            -latest `
            -products * `
            -version "[17.0,18.0)" `
            -requires Microsoft.VisualStudio.Workload.NativeDesktop Microsoft.VisualStudio.Component.VC.ATL `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "Visual Studio 2022 with NativeDesktop and VC.ATL was not found"
          }
          $vcvarsall = Join-Path $installationPath "VC\Auxiliary\Build\vcvarsall.bat"
          $tempScript = Join-Path ([IO.Path]::GetTempPath()) `
            ("navop-windows-build-{0}.cmd" -f [guid]::NewGuid())
          $commands = @(
            "@echo off",
            "chcp 65001 >nul",
            "call `"$vcvarsall`" x64",
            "if errorlevel 1 exit /b %errorlevel%",
            "cd /d `"$env:GITHUB_WORKSPACE`"",
            "cargo build -p main --target x86_64-pc-windows-msvc",
            "exit /b %errorlevel%"
          )
          $encoding = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllLines($tempScript, $commands, $encoding)
          try {
            & $env:ComSpec /d /s /c "`"$tempScript`""
            if ($LASTEXITCODE -ne 0) {
              throw "Windows build failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Remove-Item -LiteralPath $tempScript -Force -ErrorAction SilentlyContinue
          }
