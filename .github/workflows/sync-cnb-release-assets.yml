name: Sync CNB Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync"
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CNB_REPOSITORY: "navop-dev/navop"
  # CNB 只当国内镜像，旧版本没有保留价值：每次同步新版本后清掉更旧的 Release。
  CNB_RELEASE_RETENTION: "5"

concurrency:
  group: navop-cnb-release
  cancel-in-progress: false

jobs:
  sync-release-to-cnb:
    name: Sync release to CNB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Sync release assets to CNB
        env:
          TAG_NAME: ${{ inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_USERNAME: cnb
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Navop release tag: ${TAG_NAME}"
            exit 1
          fi
          if [ -z "$CNB_TOKEN" ]; then
            echo "::error::CNB_TOKEN secret is empty or not set"
            exit 1
          fi
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null

          git remote remove cnb 2>/dev/null || true
          git remote add cnb "https://cnb.cool/${CNB_REPOSITORY}.git"
          git config --global credential.helper store
          printf 'https://cnb:%s@cnb.cool\n' "$CNB_TOKEN" >"${HOME}/.git-credentials"
          chmod 600 "${HOME}/.git-credentials"
          trap 'rm -f "${HOME}/.git-credentials"' EXIT

          # CNB release synchronization requires the Git tag to exist first.
          # Because --tags pushes the complete tag set, replace every CNB tag
          # whose tag object was moved or recreated before pushing all tags.
          declare -A remote_tag_oids=()
          while read -r remote_oid remote_ref; do
            remote_tag_oids["${remote_ref#refs/tags/}"]="$remote_oid"
          done < <(git ls-remote --tags cnb | awk '$2 !~ /\^\{\}$/')

          while read -r local_ref; do
            tag_name="${local_ref#refs/tags/}"
            local_oid="$(git rev-parse "$local_ref")"
            remote_oid="${remote_tag_oids[$tag_name]-}"
            if [ -n "$remote_oid" ] && [ "$remote_oid" != "$local_oid" ]; then
              echo "CNB tag ${tag_name} points to ${remote_oid}; replacing it with ${local_oid}"
              git push cnb ":refs/tags/${tag_name}"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/tags)

          git push cnb --tags

          wget -q https://cnb.cool/znb/mpgrm/-/releases/download/v0.1.0/mpgrm_linux_amd64.tar.gz
          tar -xf mpgrm_linux_amd64.tar.gz
          chmod +x mpgrm

          # mpgrm 直接用匿名链接下载 GitHub Release 资产，连续下载若干个大文件
          # 后请求会长时间挂起，其内部 errgroup 随之死锁
          # （fatal error: all goroutines are asleep），整次同步失败。
          # 先用带 token 的 gh 把资产预取到 mpgrm 的工作目录，mpgrm 发现本地
          # 文件已完整会直接跳过下载。
          export GODEBUG=http2client=0
          asset_dir="${GITHUB_WORKSPACE}/runtime/releases/github.com/${GITHUB_REPOSITORY}/${TAG_NAME}"
          mkdir -p "${asset_dir}"
          GH_TOKEN="${GITHUB_TOKEN}" gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${asset_dir}" \
            --clobber
          prefetched_count="$(find "${asset_dir}" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          echo "prefetched assets: ${prefetched_count}"
          sync_ok=false
          for attempt in 1 2 3; do
            echo "mpgrm sync attempt ${attempt}/3 for ${TAG_NAME}"
            if ./mpgrm releases sync \
              --repo "https://github.com/${GITHUB_REPOSITORY}.git" \
              --target-repo "https://cnb.cool/${CNB_REPOSITORY}.git" \
              --tags "${TAG_NAME}"; then
              sync_ok=true
              break
            fi
            sleep 15
          done
          if [ "${sync_ok}" != "true" ]; then
            echo "::error::mpgrm release sync failed after 3 attempts for ${TAG_NAME}"
            exit 1
          fi

      # 对象存储免费额度只有 100 GiB（统计制品、LFS、图片与附件），而单版镜像
      # 已涨到约 3 GiB，历史 Release 会持续吃额度直到开始计费。这里只删 Release，
      # 不动 git tag —— 更新器靠 refs 广告发现 tag，tag 必须留着（已实测：删
      # Release 不会连带删 tag）。
      # 脚本从「本次 workflow 的 ref」取，而不是上面按 tag 检出的工作区：手工
      # 重跑旧 tag 时，那个 tag 的树里还没有这个脚本。
      # 清理失败不让整个同步 job 变红（镜像本身已经同步成功），但令牌缺
      # repo-release:rw 时报错，因为那是必须人工修一次的问题。
      - name: Checkout maintenance scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          sparse-checkout: .github/scripts
          path: .maintenance

      - name: Prune old CNB releases
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          SYNCED_TAG: ${{ inputs.tag }}
        run: bash .maintenance/.github/scripts/prune-cnb-releases.sh
