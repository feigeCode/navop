name: Windows Portable (临时验证)

# 临时 workflow：只构建 Windows x64 便携包（navop.exe + navop.portable 标记），
# 供他人验证某个改动，不发布 GitHub Release。验证结束后可直接删除本文件。
#
# 用法：Actions → 本 workflow → Run workflow，选择分支与 build_mode。

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "fast 用 thin LTO（构建快）；release 用 fat LTO + panic=abort（体积小）"
        required: true
        type: choice
        default: fast
        options:
          - fast
          - release
      label:
        description: "包名后缀，用于区分本次验证，例如 mysql-binary"
        required: false
        default: verify
        type: string
      include_rdp:
        description: "是否带 windows-native-rdp（与正式发布一致；关闭可显著缩短构建时间）"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: win-portable-${{ github.ref_name }}-${{ inputs.label }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "7200"

jobs:
  build:
    name: Build Windows x64 portable
    runs-on: windows-latest
    # 与正式发布一致：fat LTO 下 Windows x64 基线约 64min，统一给 180min
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
          cache: false

      # sccache 只是加速器：安装失败必须退化为无缓存构建，而不是让验证构建失败。
      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true

      - name: Initialize sccache
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.sccache.outcome }}" != "success" ]; then
            echo "::warning::sccache 安装失败，本次构建退化为无编译器缓存"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            exit 0
          fi
          sccache --start-server
          sccache --zero-stats
          sccache --show-stats

      - name: Restore shared Cargo inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: navop-cargo-inputs-v1-Windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            navop-cargo-inputs-v1-Windows-
            release-cargo-inputs-Windows-

      # 便携包只依赖 navop.exe、不依赖 MSI，但仍按发布口径装 NASM/CMake，
      # 避免 windows-native-rdp 的原生依赖缺工具链。
      - name: Install system dependencies (Windows)
        shell: pwsh
        run: |
          cmake --version
          choco install nasm --no-progress --yes
          $nasmDir = Join-Path $env:ProgramFiles "NASM"
          $nasmExe = Join-Path $nasmDir "nasm.exe"
          if (-not (Test-Path -LiteralPath $nasmExe -PathType Leaf)) {
            throw "NASM executable was not found at '$nasmExe'"
          }
          $env:Path = "$nasmDir;$env:Path"
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          nasm -v

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows RDP toolchain probe
        if: inputs.include_rdp
        shell: pwsh
        run: >-
          ./script/build-windows-rdp-probe.ps1
          -Target "${{ env.TARGET }}"

      - name: Compute package name
        shell: bash
        run: |
          set -euo pipefail
          label="$(printf '%s' '${{ inputs.label }}' | tr -cd 'A-Za-z0-9._-')"
          if [ -z "$label" ]; then
            label="verify"
          fi
          short_sha="$(git rev-parse --short HEAD)"
          package="navop-win-x64-portable-${short_sha}-${label}"
          echo "PACKAGE_NAME=${package}" >> "$GITHUB_ENV"
          echo "便携包名：${package}"

      - name: Build release binary (Windows)
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NAVOP_PUBLIC_BASE_URL: ${{ vars.NAVOP_PUBLIC_BASE_URL }}
          NAVOP_WEBSITE_BASE_URL: ${{ vars.NAVOP_WEBSITE_BASE_URL }}
          ONETCLI_TEAM_MANAGEMENT_URL_TEMPLATE: ${{ vars.ONETCLI_TEAM_MANAGEMENT_URL_TEMPLATE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCToolsInstallDir)) {
            throw "VCToolsInstallDir is not configured"
          }

          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker was not found at '$linker'"
          }
          [Environment]::SetEnvironmentVariable(
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER",
            $linker,
            [EnvironmentVariableTarget]::Process
          )
          Write-Host "Using MSVC linker: $linker"

          cargo --version
          rustc --version
          if ("${{ inputs.build_mode }}" -eq "fast") {
            $env:CARGO_PROFILE_RELEASE_LTO = "thin"
            $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16"
            Write-Host "Fast build mode: thin LTO, codegen-units=16"
          }

          $features = if ("${{ inputs.include_rdp }}" -eq "true") {
            @("--features", "windows-native-rdp")
          } else {
            @("--no-default-features", "--features", "wasm-components,embedded-webview")
          }
          cargo build `
            --release `
            -p main `
            @features `
            --target $env:TARGET

          $binary = "target\$env:TARGET\release\navop.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Release binary was not created: '$binary'"
          }
          Get-Item $binary | Select-Object FullName, Length

      # 便携口径与正式发布一致：单一 navop.exe + 空的 navop.portable 标记文件。
      - name: Package portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable-package | Out-Null
          Copy-Item "target/$env:TARGET/release/navop.exe" "portable-package/navop.exe"
          Set-Content -Path "portable-package/navop.portable" -Value "" -NoNewline
          Compress-Archive -Path "portable-package/*" -DestinationPath "$env:PACKAGE_NAME.zip"

          $archive = Get-Item "$env:PACKAGE_NAME.zip"
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash
          "$hash  $env:PACKAGE_NAME.zip" |
            Out-File -FilePath "$env:PACKAGE_NAME.zip.sha256" -Encoding utf8

          $sizeMb = [math]::Round($archive.Length / 1MB, 1)
          Write-Host "便携包：$($archive.Name)（${sizeMb} MiB）"
          Write-Host "SHA256：$hash"

      - name: Show sccache stats
        if: always()
        shell: bash
        continue-on-error: true
        run: sccache --show-stats

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_NAME }}.zip.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Windows 便携包（临时验证）'
            echo ''
            echo "- 分支：\`${GITHUB_REF_NAME}\`"
            echo "- commit：\`${GITHUB_SHA}\`"
            echo "- 构建模式：\`${{ inputs.build_mode }}\`（RDP：${{ inputs.include_rdp }}）"
            echo "- 产物：\`${PACKAGE_NAME}.zip\`（解压后得到 \`navop.exe\` + \`navop.portable\`）"
            echo "- 校验：\`${PACKAGE_NAME}.zip.sha256\`"
            echo ''
            echo '下载位置：本次运行页面底部的 Artifacts。'
          } >> "$GITHUB_STEP_SUMMARY"
