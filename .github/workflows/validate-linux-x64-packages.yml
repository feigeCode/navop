name: Validate Linux x64 Packages (Temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-linux-x64-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "7200"

jobs:
  build:
    name: Build Linux x64 (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            os: ubuntu-latest
            archive: navop-x86_64-unknown-linux-gnu.tar.gz
            portable: false
          - variant: portable
            os: ubuntu-22.04
            archive: navop-x86_64-unknown-linux-gnu-portable.tar.gz
            portable: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Check out requested revision
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu
          cache: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Initialize sccache
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server
          sccache --zero-stats

      - name: Restore shared Cargo inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: navop-cargo-inputs-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            navop-cargo-inputs-v1-${{ runner.os }}-
            release-cargo-inputs-${{ runner.os }}-x86_64-unknown-linux-gnu-

      - name: Install Linux dependencies
        run: script/bootstrap

      - name: Install Zig toolchain
        if: matrix.portable
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ziglang"
          "$RUNNER_TEMP/ziglang/bin/python" -m pip install ziglang==0.14.1
          cargo install --locked cargo-zigbuild --version 0.23.0
          echo "CARGO_ZIGBUILD_PYTHON_PATH=$RUNNER_TEMP/ziglang/bin/python" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ziglang/bin/python" -m ziglang version
          cargo zigbuild --version

      - name: Install portable packaging dependencies
        if: matrix.portable
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils musl-tools

      - name: Set application version
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            awk -F'"' '
              /^\[package\]$/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && /^version = "/ { print $2; exit }
            ' main/Cargo.toml
          )"
          test -n "$version"
          echo "ONETCLI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify required build secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || {
            echo "::error::SUPABASE_URL secret is empty or not set"
            exit 1
          }
          test -n "$SUPABASE_ANON_KEY" || {
            echo "::error::SUPABASE_ANON_KEY secret is empty or not set"
            exit 1
          }

      - name: Build release binary
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NAVOP_PUBLIC_BASE_URL: ${{ vars.NAVOP_PUBLIC_BASE_URL }}
          NAVOP_WEBSITE_BASE_URL: ${{ vars.NAVOP_WEBSITE_BASE_URL }}
          ONETCLI_TEAM_MANAGEMENT_URL_TEMPLATE: ${{ vars.ONETCLI_TEAM_MANAGEMENT_URL_TEMPLATE }}
          PORTABLE: ${{ matrix.portable }}
        run: |
          set -euo pipefail
          cargo --version
          rustc --version
          if [ "$PORTABLE" = "true" ]; then
            cargo zigbuild \
              --release \
              -p main \
              --target x86_64-unknown-linux-gnu.2.28 \
              --no-default-features \
              --features wasm-components
          else
            cargo build \
              --release \
              -p main \
              --target x86_64-unknown-linux-gnu
          fi
          test -x target/x86_64-unknown-linux-gnu/release/navop

      - name: Verify portable GLIBC baseline
        if: matrix.portable
        shell: bash
        run: |
          set -euo pipefail
          script/check-linux-glibc-baseline.sh \
            target/x86_64-unknown-linux-gnu/release/navop \
            2.28

      - name: Package archive
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          PORTABLE: ${{ matrix.portable }}
        run: |
          set -euo pipefail
          rm -rf package
          if [ "$PORTABLE" = "true" ]; then
            script/package-linux-portable.sh \
              --binary target/x86_64-unknown-linux-gnu/release/navop \
              --output package \
              --launcher-source script/linux-portable-launcher.c \
              --target x86_64-unknown-linux-gnu \
              --glibc-baseline 2.28
          else
            mkdir -p package/usr/bin
            cp target/x86_64-unknown-linux-gnu/release/navop package/usr/bin/
          fi

          mkdir -p package/usr/share/applications
          mkdir -p package/usr/share/mime/packages
          mkdir -p package/usr/share/icons/hicolor/{128x128,256x256,512x515}/apps
          cp resources/linux/navop.desktop package/usr/share/applications/
          cp resources/linux/navop.xml package/usr/share/mime/packages/
          cp resources/linux/navop-128.png package/usr/share/icons/hicolor/128x128/apps/navop.png
          cp resources/linux/navop-256.png package/usr/share/icons/hicolor/256x256/apps/navop.png
          cp resources/linux/navop-512.png package/usr/share/icons/hicolor/512x515/apps/navop.png
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$ARCHIVE" \
            -C package .
          test -s "$ARCHIVE"

      - name: Validate archive layout
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          PORTABLE: ${{ matrix.portable }}
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/validate-package"
          rm -rf "$extracted"
          mkdir -p "$extracted"
          tar -xzf "$ARCHIVE" -C "$extracted"

          test -x "$extracted/usr/bin/navop"
          test -f "$extracted/usr/share/applications/navop.desktop"
          test -f "$extracted/usr/share/mime/packages/navop.xml"

          if [ "$PORTABLE" = "true" ]; then
            runtime="$extracted/usr/lib/navop"
            test -x "$runtime/bin/navop.real"
            test -f "$runtime/lib/ld-linux-x86-64.so.2"
            test -f "$runtime/lib/libc.so.6"
            test -f "$runtime/runtime-manifest.json"
            test -s "$runtime/runtime-packages.txt"
            script/check-linux-glibc-baseline.sh "$runtime/bin/navop.real" 2.28
            "$runtime/lib/ld-linux-x86-64.so.2" \
              --inhibit-cache \
              --library-path "$runtime/lib" \
              --verify "$runtime/bin/navop.real"
            python3 - "$runtime/runtime-manifest.json" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert manifest["schema_version"] == 1
          assert manifest["product"] == "navop"
          assert manifest["target"] == "x86_64-unknown-linux-gnu"
          assert manifest["binary_glibc_baseline"] == "2.28"
          assert manifest["entrypoint"] == "usr/bin/navop"
          assert manifest["binary"] == "usr/lib/navop/bin/navop.real"
          assert manifest["loader"] == "usr/lib/navop/lib/ld-linux-x86-64.so.2"
          assert manifest["library_path"] == "usr/lib/navop/lib"
          PY
          else
            test ! -e "$extracted/usr/lib/navop/runtime-manifest.json"
            test ! -e "$extracted/usr/lib/navop/bin/navop.real"
          fi

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify both Linux x64 artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download standard archive
        uses: actions/download-artifact@v4
        with:
          name: navop-x86_64-unknown-linux-gnu.tar.gz
          path: artifacts

      - name: Download portable archive
        uses: actions/download-artifact@v4
        with:
          name: navop-x86_64-unknown-linux-gnu-portable.tar.gz
          path: artifacts

      - name: Confirm both archives
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/navop-x86_64-unknown-linux-gnu.tar.gz
          test -s artifacts/navop-x86_64-unknown-linux-gnu-portable.tar.gz
          count="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              -name 'navop-x86_64-unknown-linux-gnu*.tar.gz' \
              | wc -l
          )"
          test "$count" -eq 2
          {
            echo "## Linux x64 package validation"
            echo
            echo "- Standard archive: validated"
            echo "- Portable GLIBC 2.28 archive: validated"
          } >> "$GITHUB_STEP_SUMMARY"
