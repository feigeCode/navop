name: Build ARM Linux Release

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to build and update, for example v0.8.10
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: arm-linux-dispatch-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve ARM Linux release request
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      skip: ${{ steps.release.outputs.skip }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_TAG" ]; then
            release_tag="$INPUT_TAG"
            release_platform="manual"
          else
            mkdir -p run-metadata
            if ! gh run download "$WORKFLOW_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name release-metadata \
              --dir run-metadata; then
              echo "::warning::Release workflow metadata was not found; skipping ARM Linux dispatch."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            release_tag="$(node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("run-metadata/release-metadata.json", "utf8")); process.stdout.write(data.release_tag || "");')"
            release_platform="$(node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("run-metadata/release-metadata.json", "utf8")); process.stdout.write(data.platform || "");')"
          fi

          if [ -z "$release_tag" ]; then
            echo "::warning::Release tag is empty; skipping ARM Linux dispatch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$release_platform" != "manual" ] && [ "$release_platform" != "all" ]; then
            echo "Release platform is $release_platform; no ARM follow-up is required."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  dispatch:
    name: Start ARM Linux release build
    needs: resolve
    if: ${{ needs.resolve.outputs.skip == 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch shared release builder
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref dev \
            -f tag="$RELEASE_TAG" \
            -f platform=linux-arm64
