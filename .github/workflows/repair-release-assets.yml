name: Repair Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to repair, for example v0.8.11
        required: true
        type: string
      run_id:
        description: Completed Release workflow run containing the build artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish existing release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -maxdepth 2 -type f -print

      - name: Merge existing assets and generate checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p publish
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "navop-*" \
              --pattern "navop_*" \
              --dir publish; then
              echo "No existing release assets found; publishing only downloaded artifacts."
            fi
          fi
          cp -a artifacts/. publish/
          cd publish
          shopt -s nullglob
          release_files=(navop-* navop_*)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts found for checksum generation"
            exit 1
          fi
          sha256sum "${release_files[@]}" > sha256sums.txt
          cat sha256sums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          new_files=(publish/navop-* publish/navop_*)
          if [ "${#new_files[@]}" -eq 0 ]; then
            echo "::error::No release assets found"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "${new_files[@]}" \
            publish/sha256sums.txt
