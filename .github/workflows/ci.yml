name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Run all platforms or only one platform"
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - macos

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare CI matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Resolve requested platforms
        id: matrix
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          platform="${REQUESTED_PLATFORM:-all}"
          linux='{"target":"x86_64-linux-gnu","run_on":"ubuntu-latest","platform":"linux"}'
          windows='{"target":"x86_64-windows-msvc","run_on":"windows-latest","platform":"windows"}'
          macos='{"target":"aarch64-apple-darwin","run_on":"macos-latest","platform":"macos"}'
          case "$platform" in
            all) matrix="[$macos,$linux,$windows]" ;;
            linux) matrix="[$linux]" ;;
            windows) matrix="[$windows]" ;;
            macos) matrix="[$macos]" ;;
            *) echo "::error::Unsupported platform: $platform"; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.platform }}, ${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.run_on }}
    steps:
      - uses: actions/checkout@v7
      - name: Test release packaging
        if: ${{ matrix.run_on == 'ubuntu-latest' }}
        run: node --test script/test-release-packaging.mjs
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        if: ${{ matrix.run_on != 'windows-latest' }}
        run: script/bootstrap
      - name: Setup | Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked --version 1.251.0
      - name: Test Linux
        if: ${{ matrix.run_on == 'ubuntu-latest' }}
        run: |
          cargo test --all
      - name: Test Windows
        if: ${{ matrix.run_on == 'windows-latest' }}
        run: |
          cargo test --all
      - name: Test MacOS
        if: ${{ matrix.run_on == 'macos-latest' }}
        run: |
          cargo test --all
          cargo test -p gpui-component --doc
