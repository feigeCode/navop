name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "Run all platforms or only one platform"
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - macos

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "7200"

jobs:
  prepare:
    name: Prepare CI matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      product_matrix: ${{ steps.products.outputs.product_matrix }}

    steps:
      - name: Resolve requested platforms
        id: matrix
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          platform="${REQUESTED_PLATFORM:-all}"
          linux='{"target":"x86_64-unknown-linux-gnu","run_on":"ubuntu-latest","platform":"linux"}'
          windows='{"target":"x86_64-pc-windows-msvc","run_on":"windows-2022","platform":"windows"}'
          macos='{"target":"aarch64-apple-darwin","run_on":"macos-latest","platform":"macos"}'
          case "$platform" in
            all) matrix="[$macos,$linux,$windows]" ;;
            linux) matrix="[$linux]" ;;
            windows) matrix="[$windows]" ;;
            macos) matrix="[$macos]" ;;
            *) echo "::error::Unsupported platform: $platform"; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # 产品检查是「一个产品 × 一个目标」一条，矩阵项比测试矩阵多得多，
      # 所以单独按 REQUESTED_PLATFORM 裁剪，让 workflow_dispatch 选单个平台时
      # 只跑该平台的三条。
      - name: Resolve product check matrix
        id: products
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          platform="${REQUESTED_PLATFORM:-all}"
          navop_linux='{"product":"navop","target":"x86_64-unknown-linux-gnu","run_on":"ubuntu-latest","platform":"linux","args":""}'
          navop_macos='{"product":"navop","target":"aarch64-apple-darwin","run_on":"macos-latest","platform":"macos","args":""}'
          navop_win_x64='{"product":"navop","target":"x86_64-pc-windows-msvc","run_on":"windows-2022","platform":"windows","args":"--features windows-native-rdp"}'
          navop_win_x86='{"product":"navop","target":"i686-pc-windows-msvc","run_on":"windows-2022","platform":"windows","args":"--no-default-features --features wasm-components,windows-native-rdp"}'
          shell_linux='{"product":"navop-shell","target":"x86_64-unknown-linux-gnu","run_on":"ubuntu-latest","platform":"linux","args":""}'
          shell_macos='{"product":"navop-shell","target":"aarch64-apple-darwin","run_on":"macos-latest","platform":"macos","args":""}'
          shell_win='{"product":"navop-shell","target":"x86_64-pc-windows-msvc","run_on":"windows-2022","platform":"windows","args":""}'
          data_linux='{"product":"navop-data","target":"x86_64-unknown-linux-gnu","run_on":"ubuntu-latest","platform":"linux","args":""}'
          data_macos='{"product":"navop-data","target":"aarch64-apple-darwin","run_on":"macos-latest","platform":"macos","args":""}'
          data_win='{"product":"navop-data","target":"x86_64-pc-windows-msvc","run_on":"windows-2022","platform":"windows","args":""}'
          linux="[$navop_linux,$shell_linux,$data_linux]"
          macos="[$navop_macos,$shell_macos,$data_macos]"
          windows="[$navop_win_x64,$navop_win_x86,$shell_win,$data_win]"
          case "$platform" in
            all) product_matrix="[$navop_linux,$navop_macos,$navop_win_x64,$navop_win_x86,$shell_linux,$shell_macos,$shell_win,$data_linux,$data_macos,$data_win]" ;;
            linux) product_matrix="$linux" ;;
            windows) product_matrix="$windows" ;;
            macos) product_matrix="$macos" ;;
            *) echo "::error::Unsupported platform: $platform"; exit 1 ;;
          esac
          echo "product_matrix=$product_matrix" >> "$GITHUB_OUTPUT"

  # 发布 PR 只改 CHANGELOG + 版本号，跑全平台测试没有意义：这一层只做分类，
  # 并在判定为发布改动时就地校验 changelog 与版本号；其余 PR 照旧跑全量测试。
  classify:
    name: Classify changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      release_only: ${{ steps.check.outputs.release_only }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify and validate release-only changes
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 script/release_pr.py check

  test:
    name: Test (${{ matrix.platform }}, ${{ matrix.target }})
    needs: [prepare, classify]
    if: ${{ needs.classify.outputs.release_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.run_on }}
    steps:
      - uses: actions/checkout@v7
      - name: Install NASM
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          $nasmDir = Join-Path $env:ProgramFiles "NASM"
          $nasmExe = Join-Path $nasmDir "nasm.exe"
          if (-not (Test-Path -LiteralPath $nasmExe -PathType Leaf)) {
            throw "NASM executable was not found at '$nasmExe'"
          }
          $env:Path = "$nasmDir;$env:Path"
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          nasm -v
      - name: Test release packaging
        if: ${{ matrix.run_on == 'ubuntu-latest' }}
        run: node --test script/test-release-packaging.mjs
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
      # sccache 只是构建加速器：GitHub Release CDN 偶发 504 会让下载安装失败，
      # 此时必须退化成无缓存构建，而不是让整个测试 job 失败。
      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
      - name: Initialize sccache
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.sccache.outcome }}" != "success" ]; then
            echo "::warning::sccache 安装失败，本次构建退化为无编译器缓存"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            exit 0
          fi
          sccache --start-server
          sccache --zero-stats
          sccache --show-stats
      - name: Restore shared Cargo inputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: navop-cargo-inputs-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            navop-cargo-inputs-v1-${{ runner.os }}-
            release-cargo-inputs-${{ runner.os }}-${{ matrix.target }}-
      - name: Install system dependencies
        if: ${{ matrix.platform != 'windows' }}
        run: script/bootstrap
      - name: Install lrzsz on Linux
        if: ${{ matrix.platform == 'linux' }}
        run: sudo apt-get update && sudo apt-get install -y lrzsz
      - name: Install lrzsz on macOS
        if: ${{ matrix.platform == 'macos' }}
        run: brew list lrzsz >/dev/null 2>&1 || brew install lrzsz
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked --version 1.251.0
      - name: Test Linux
        if: ${{ matrix.platform == 'linux' }}
        run: |
          cargo test --all
      # 默认构建（三平台一致）不带 `embedded-webview`：它的宿主 WebView 在 Linux 上
      # 无法随发布包提供（原因见 crates/navop_app/Cargo.toml）。`cargo test --all` 编的正是这个
      # 默认形态，所以「显式打开该 feature」的那一半反而没有地方会编到 —— 在这里补一次
      # check，免得它悄悄腐烂到有人真要用时才发现。
      # 本步骤依赖 `script/install-linux.sh` 装上的 webkit2gtk-4.1 开发包。
      - name: Check the opt-in embedded webview feature
        if: ${{ matrix.platform == 'linux' }}
        run: |
          set -euo pipefail
          cargo check -p ai_chat_view --features embedded-webview --tests
          cargo check -p navop_app --features embedded-webview
      - name: Test Windows
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: ./script/test-windows.ps1
      - name: Test MacOS
        if: ${{ matrix.platform == 'macos' }}
        run: |
          cargo test --all
      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true

  # 发版矩阵（.github/workflows/release.yml）是「一个产品 × 一个目标」各自编译：
  # 每个 job 只带自己那一个产品，extension-runtime 之类共享 crate 的 feature 就按
  # 该产品的特性集求值。而 `cargo test --all` 会把整个 workspace 的特性合并求值，
  # 于是「某个产品单独构建时这段代码没有调用者 / 这个 feature 不存在」这类问题
  # 只有在发版时才炸：beta.1 的 `navop ... does not contain these features`、
  # beta.2 的 navop-data 未门控终端视图、beta.3 的 install_flow 死代码都是这一类。
  #
  # 这里按发版矩阵逐产品、逐目标编译一次，参数抄自 release.yml 的构建步骤
  # （独立产品不传 feature；navop 的 win32 是「默认集减去 shell-plugins」）。
  # 只把 `cargo build --release` 换成 `cargo check`：feature 门控、未使用导入、
  # 死代码在 check 阶段就会带着 `-D warnings` 报错，代价比完整构建小一个量级。
  # 覆盖 linux x64 / macOS arm64 / Windows x64（+ navop 的 win32）这几个
  # 真正出过问题的形态；macOS x64 与 linux arm64 只是同一份代码换目标，暂不重复。
  product-check:
    name: Build shape (${{ matrix.product }} / ${{ matrix.target }})
    needs: [prepare, classify]
    if: ${{ needs.classify.outputs.release_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.product_matrix) }}
    runs-on: ${{ matrix.run_on }}
    steps:
      - uses: actions/checkout@v7
      - name: Install NASM
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          $nasmDir = Join-Path $env:ProgramFiles "NASM"
          $nasmExe = Join-Path $nasmDir "nasm.exe"
          if (-not (Test-Path -LiteralPath $nasmExe -PathType Leaf)) {
            throw "NASM executable was not found at '$nasmExe'"
          }
          $env:Path = "$nasmDir;$env:Path"
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          nasm -v
      - name: Configure MSVC environment
        if: ${{ matrix.platform == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ contains(matrix.target, 'i686') && 'x86' || 'x64' }}
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
      - name: Initialize sccache
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.sccache.outcome }}" != "success" ]; then
            echo "::warning::sccache 安装失败，本次构建退化为无编译器缓存"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            exit 0
          fi
          sccache --start-server
          sccache --show-stats
      - name: Restore shared Cargo inputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: navop-cargo-inputs-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            navop-cargo-inputs-v1-${{ runner.os }}-
            release-cargo-inputs-${{ runner.os }}-${{ matrix.target }}-
      - name: Install system dependencies
        if: ${{ matrix.platform != 'windows' }}
        run: script/bootstrap
      - name: Check the product build shape
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p ${{ matrix.product }} --target ${{ matrix.target }} ${{ matrix.args }}

  windows-rdp-probe:
    name: Windows RDP probe (${{ matrix.target }})
    needs: [classify]
    if: >-
      ${{
        (inputs.platform == '' ||
         inputs.platform == 'all' ||
         inputs.platform == 'windows') &&
        needs.classify.outputs.release_only != 'true'
      }}
    runs-on: windows-2022
    env:
      RUSTC_WRAPPER: ""
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          $nasmDir = Join-Path $env:ProgramFiles "NASM"
          $nasmExe = Join-Path $nasmDir "nasm.exe"
          if (-not (Test-Path -LiteralPath $nasmExe -PathType Leaf)) {
            throw "NASM executable was not found at '$nasmExe'"
          }
          $env:Path = "$nasmDir;$env:Path"
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          nasm -v
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
      - name: Build ATL/MSVC probe
        shell: pwsh
        run: >-
          ./script/build-windows-rdp-probe.ps1
          -Target "${{ matrix.target }}"

  ci-gate:
    name: CI gate
    needs: [prepare, classify, test, product-check, windows-rdp-probe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any CI job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
