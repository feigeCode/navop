name: 数据库支持 / Database Support
description: 请求支持数据库、驱动、版本或数据库能力 / Request database, driver, version, or capability support
title: "[Database]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        告诉我们数据库名称和你需要的能力即可，其他信息都可以后续补充。

        Tell us the database and capability you need; other details can be added later.

  - type: input
    id: database
    attributes:
      label: 数据库 / Database
      placeholder: "例如 / e.g. OceanBase 4.3 (MySQL mode)"
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: 你需要什么支持？/ What support do you need?
      description: 简单描述当前无法完成的操作。Briefly describe what you cannot do today.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 可选：数据库版本、Navop 版本、官方文档、截图或错误信息。Optional versions, official documentation, screenshots, or errors.
