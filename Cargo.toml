gpui-shell = { package = "gpui_ce_components_shell", git = "https://github.com/feigeCode/gpui-component.git", rev = "19b2bc43", version = "0.2.0" }
gpui-component-shell = { package = "gpui-component-shell", git = "https://github.com/feigeCode/gpui-component.git", rev = "19b2bc43", version = "0.1.0" }
gpui-wry = { package = "gpui_ce_components_webview", git = "https://github.com/feigeCode/gpui-component.git", rev = "19b2bc43", version = "0.2.0" }

gpui = { package = "gpui-ce", git = "https://github.com/feigeCode/gpui-ce.git", rev = "88bc1b53e49c5f95aa6c7b13e9460ed9f85502cf", version = "=0.2.2" }
gpui_tokio = { package = "gpui_ce_tokio", git = "https://github.com/feigeCode/gpui-ce.git", rev = "88bc1b53e49c5f95aa6c7b13e9460ed9f85502cf" }
