async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }



# Use stacker's psm version which may have better WASM support
psm = { git = "https://github.com/rust-lang/stacker", branch = "master" }

[patch."https://github.com/zed-industries/zed"]
gpui = { package = "gpui-ce", git = "https://github.com/feigeCode/gpui-ce.git", rev = "88bc1b53e49c5f95aa6c7b13e9460ed9f85502cf", version = "=0.2.2" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/feigeCode/gpui-ce.git", rev = "88bc1b53e49c5f95aa6c7b13e9460ed9f85502cf" }
gpui_macros = { package = "gpui_ce_macros", git = "https://github.com/feigeCode/gpui-ce.git", rev = "88bc1b53e49c5f95aa6c7b13e9460ed9f85502cf" }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.61.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

[profile.dev]
#codegen-units = 16
#debug = "limited"
#split-debuginfo = "unpacked"

# 优化级别：0=无优化（默认，调试最佳），1=轻度优化，2=中度，3=高度
opt-level = 0
# 是否启用调试符号：true=启用（默认），false=禁用，"full"=完整符号（推荐）
debug = true
# 是否启用 debuginfo 行表（保证调试器能对应源码行）
debug-assertions = true
# 是否启用溢出检查（Debug 模式默认开启，Release 关闭）
overflow-checks = true
# 是否增量编译（加速二次构建，默认开启）
incremental = true
# panic 处理方式："unwind"=展开栈（默认），"abort"=直接终止程序
panic = "unwind"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-ce = { opt-level = 3 }
gpui_ce_macros = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
zed-sum-tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
reqwest_client = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }
