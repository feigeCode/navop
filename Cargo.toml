# <<< local gpui patch <<<

# navop 全量 gpui-fast 后，整套 gpui-fast-* 都进编译图；同名源已在上面
# [patch.crates-io] 块内统一钉到 release/v0.1.12，此处不再重复声明。

# Legacy devices (e.g. Huawei VRP gear) put redundant leading `0x00` bytes in the
# RSA exponent/modulus of their `ssh-rsa` host key, which RFC 4251 § 5 forbids but
# OpenSSH tolerates when reading a peer's message. Without this patch the whole
# host key fails to parse and the connection dies with
# `SshKey: \`mpint\` encoding invalid`. Fork of RustCrypto/SSH carrying tag
# `ssh-encoding/v0.3.0-navop.1`; drop once the change lands upstream.
# Regression test: crates/ssh/tests/legacy_hostkey_mpint.rs
ssh-encoding = { git = "https://github.com/feigeCode/SSH.git", tag = "ssh-encoding/v0.3.0-navop.1" }

# russh（截至 v0.65.0 的全部已发布版本）钉 `rsa =0.10.0-rc.18` +
# `pkcs1 =0.8.0-rc.4`，而 quickjs-jit-stdlib 0.14.1（gpui-shell 的 quickjs
# crypto 模块）要求 `rsa ^0.10.0-rc.19`，两者无法同时满足。rsa rc.18→rc.19
# 仅伴随 pkcs1 rc.4→rc.5 的泛型化（`RsaPrivateKeyRef<'a>` 别名保持
# `try_from(&[u8])`/`as_bytes()` 旧用法），russh 源码零改动即兼容。Fork of
# warp-tech/russh carrying tag `v0.65.0-navop.1`（仅改两行版本钉 + 删 CI
# workflows）；等 russh 上游跟进 rc.19 后可删除。
# 验证：cargo check -p ssh 与 crates/ssh 全量测试（含 legacy hostkey 回归）。
russh = { git = "https://github.com/feigeCode/russh.git", tag = "v0.65.0-navop.1" }
