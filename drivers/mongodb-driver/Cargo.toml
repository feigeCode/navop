[package]
name = "onetcli-mongodb-driver"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "onetcli-mongodb-modern-driver"
path = "src/bin/modern.rs"

[[bin]]
name = "onetcli-mongodb-legacy-driver"
path = "src/bin/legacy.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bson = { version = "2.13", features = ["chrono-0_4"] }
extension-driver.workspace = true
extension-protocol.workspace = true
futures-util.workspace = true
mongodb.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
