    zh-HK: 解鎖
  change_repo_password:
    en: Change Master Key
    zh-CN: 修改主密钥
    zh-HK: 修改主密鑰
  repo_password_label:
    en: "Master Key:"
    zh-CN: "主密钥："
    zh-HK: "主密鑰："
  repo_password_placeholder:
    en: Enter your master key
    zh-CN: 输入您的主密钥
    zh-HK: 輸入您的主密鑰
  old_password_label:
    en: "Old Master Key:"
    zh-CN: "旧主密钥："
    zh-HK: "舊主密鑰："
  old_password_placeholder:
    en: Enter your old master key
    zh-CN: 输入旧主密钥
    zh-HK: 輸入舊主密鑰
  new_password_label:
    en: "New Master Key:"
    zh-CN: "新主密钥："
    zh-HK: "新主密鑰："
  new_password_placeholder:
    en: Enter your new master key
    zh-CN: 输入新主密钥
    zh-HK: 輸入新主密鑰
  remember_password_title:
    en: "Please remember your master key"
    zh-CN: "请牢记你的主密钥"
    zh-HK: "請牢記你的主密鑰"
  remember_password_detail_local:
    en: "The master key encrypts all locally stored sensitive data such as database passwords, SSH keys, etc., preventing data leakage even if local files are compromised."
    zh-CN: "主密钥会对本地存储的所有敏感数据（如数据库密码、SSH 密钥等）进行加密，即使本地文件被窃取也无法获取明文信息。"
    zh-HK: "主密鑰會對本地存儲的所有敏感數據（如數據庫密碼、SSH 密鑰等）進行加密，即使本地文件被竊取也無法獲取明文信息。"
  remember_password_detail_cloud:
    en: "All data is encrypted locally before being pushed to the cloud. The cloud server only stores encrypted strings and cannot decrypt the content. If the master key is forgotten, the cloud data cannot be recovered."
    zh-CN: "所有数据在本地加密后才会推送到云端，云端服务器仅存储密文，无法解密内容。主密钥一旦遗忘，云端数据将无法恢复。"
    zh-HK: "所有數據在本地加密後才會推送到雲端，雲端服務器僅存儲密文，無法解密內容。主密鑰一旦遺忘，雲端數據將無法恢復。"
  key_empty:
    en: "Master key cannot be empty"
    zh-CN: "主密钥不能为空"
    zh-HK: "主密鑰不能為空"
  key_mismatch:
    en: "The two keys do not match"
    zh-CN: "两次输入的密钥不一致"
    zh-HK: "兩次輸入的密鑰不一致"
  password_incorrect:
    en: "Incorrect master key"
    zh-CN: "主密钥错误"
    zh-HK: "主密鑰錯誤"
  confirm_password_placeholder:
    en: Confirm your master key
    zh-CN: 确认您的主密钥
    zh-HK: 確認您的主密鑰
  confirm_password_label:
    en: "Confirm Master Key:"
    zh-CN: "确认主密钥："
    zh-HK: "確認主密鑰："
  key_unlocked:
    en: Unlocked
    zh-CN: 已解锁
    zh-HK: 已解鎖
  key_unlocked_tooltip:
    en: Master key is unlocked, click to change
