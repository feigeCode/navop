    en: Automatic session logging records output only and never records keyboard input, reducing exposure of passwords, tokens, and one-time codes. Session logs have no playback timeline or replay controls.
    zh-CN: 自动会话日志只记录输出，绝不记录键盘输入，以减少密码、令牌和一次性验证码泄露风险。会话日志没有播放时间轴或回放控制。
    zh-HK: 自動工作階段日誌只記錄輸出，絕不記錄鍵盤輸入，以減少密碼、權杖和一次性驗證碼外洩風險。工作階段日誌沒有播放時間軸或回放控制。
