    en: ".cast is the source container for a static, read-only terminal history. Open it to scroll, select, copy, and search just like a terminal; TXT is a readable exported copy."
    zh-CN: ".cast 是静态只读终端历史的源文件。打开后可像终端一样滚动、选中、复制和搜索；TXT 是导出的可读副本。"
    zh-HK: ".cast 是靜態唯讀終端歷史的來源檔案。開啟後可像終端一樣捲動、選取、複製和搜尋；TXT 是匯出的可讀副本。"
