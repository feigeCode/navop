[package]
name = "main"
version = "0.19.1"
publish.workspace = true
edition.workspace = true

[[bin]]
name = "navop"
path = "src/main.rs"

[dependencies]
one-assets = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true, features = ["tree-sitter-bash", "tree-sitter-sql"] }
gpui-component-assets = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dotenvy = "0.15"
rust-i18n = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
percent-encoding = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
dirs = {workspace = true}
futures = { workspace = true }
smol = { workspace = true }
db_view = { workspace = true }
extension-runtime = { workspace = true, features = ["wasm-components"] }
extension-host.workspace = true
extension-plugin-adapter.workspace = true
extension-protocol.workspace = true
extension_view = { workspace = true }
notes = { workspace = true }
universal-plugins.workspace = true
resource_view.workspace = true
json_view = { workspace = true }
terminal = { workspace = true }
terminal_view = { workspace = true }
agent_runtime = { workspace = true }
ai_chat_view = { workspace = true, default-features = false }
public_mcp = { workspace = true }
tool_runtime = { workspace = true }
port_forwarding = { workspace = true }
port_forwarding_view = { workspace = true }
sftp_view = { workspace = true }
known_hosts_view = { workspace = true }
ssh.workspace = true
redis_view = { workspace = true }
redis-runtime.workspace = true
mongodb_view = { workspace = true }
mongodb-runtime.workspace = true
remote_desktop = { workspace = true }
remote_desktop_view = { workspace = true }
remote_file_editor = { workspace = true }
one-core.workspace = true
one-ui.workspace = true
navop_runtime.workspace = true
reqwest_client.workspace = true
db.workspace = true
connection-import-protocol.workspace = true
connection-form.workspace = true
global-hotkey.workspace = true
process-util.workspace = true
sha2 = { workspace = true }
zeroize = { workspace = true }
flate2 = "1"
tar = "0.4"
# `window_visibility` 要拿 AppKit/Win32/Xcb 原生句柄，并对 `HandleError` 用
# `anyhow::Context`；`raw-window-handle` 0.6 没有默认特性，`std` 必须显式开，
# 否则 `HandleError` 不实现 `std::error::Error`（今天靠别的 crate 顺带开启）。
raw-window-handle = { workspace = true, features = ["std"] }
image = { workspace = true }
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "110523127440aefb11ce0cf280ae7c5071337ec5", package = "zed-font-kit", version = "0.14.1-zed" }

# 窗口可见性适配（`window_visibility`）：AppKit 的 orderOut/makeKeyAndOrderFront。
# objc2 生态版本与 gpui-pre 及 crates/remote_desktop_view 保持一致，避免重复版本。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

# 系统托盘（`system_tray`）。macOS/Windows 用 tray-icon 的原生后端；
# Linux 只启用它的 ksni 后端（freedesktop StatusNotifierItem），必须关掉默认的
# libappindicator/libxdo —— 否则会把 GTK 事件循环和 libappindicator/libxdo
# 系统依赖带进 Linux 构建。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# X11 的真正隐藏（unmap/map）：raw-window-handle 0.6 的 Xcb 句柄不带连接，
# 所以自己建一条到同一 X server 的连接。
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
async-trait = { workspace = true }
extension-protocol = { workspace = true }
tempfile = "3"

[features]
# `embedded-webview`（AI 对话里的 HTML 预览弹窗）默认关闭，三个平台一致。
#
# 它要宿主的系统 WebView，Linux 上是 WebKitGTK 4.1，而这个库无法随发布包提供：
# 带 WebKitGTK 4.1 的发行版都构建在 glibc 2.39+ 上、与发布包的 2.28 基线不相配，
# 且 `WebKitWebProcess` 是按编译期路径解析的独立 ELF，外挂不了 —— 所以 Linux 上
# 带它就直接起不来（`error while loading shared libraries: libwebkit2gtk-4.1.so.0`）。
# macOS/Windows 的系统 WebView 不受此限，但只有 Linux 关掉会让三个平台各发一种形态，
# 因此统一关默认。
#
# 关闭时弹窗降级为「无法创建 HTML 预览 webview，已保留源码视图」（`HtmlPreview.webview_unavailable`），
# 「用浏览器打开」与「下载 HTML」两条路径不受影响。
# 需要时显式开启：`cargo build -p main --features embedded-webview`
# （Linux 另需 `webkit2gtk-4.1` 开发包，见 `script/install-linux.sh`）。
default = ["wasm-components", "windows-native-rdp", "shell-plugins"]
builtin-duckdb = ["db/builtin-duckdb", "db_view/builtin-duckdb", "navop_runtime/builtin-duckdb"]
builtin-mongodb = ["mongodb_view/builtin-mongodb"]
builtin-data-drivers = ["builtin-mongodb"]
embedded-webview = ["ai_chat_view/embedded-webview"]
github-distribution = ["github-updates", "github-marketplace"]
github-marketplace = ["extension-runtime/github-marketplace"]
github-updates = []
screenshot-safe = []
shell-plugins = ["universal-plugins/shell-plugins"]
wasm-components = ["extension-runtime/wasm-components"]
windows-native-rdp = ["remote_desktop_view/windows-native-rdp"]

[lints]
workspace = true
