[package]
name = "main"
version = "0.5.0"
publish.workspace = true
edition.workspace = true

[[bin]]
name = "onetcli"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rust-i18n = { workspace = true }
base64 = { workspace = true }
dirs = {workspace = true}
futures = { workspace = true }
smol = { workspace = true }
db_view = { workspace = true }
extension-runtime = { workspace = true }
extension_view = { workspace = true }
terminal = { workspace = true }
terminal_view = { workspace = true }
public_mcp = { workspace = true }
sftp_view = { workspace = true }
redis_view = { workspace = true }
mongodb_view = { workspace = true }
remote_file_editor = { workspace = true, features = ["ui"] }
one-core.workspace = true
one-ui.workspace = true
reqwest_client.workspace = true
db.workspace = true
global-hotkey.workspace = true
sha2 = { workspace = true }
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[features]
default = ["wasm-components"]
builtin-duckdb = ["db/builtin-duckdb", "db_view/builtin-duckdb"]
compare = ["db/compare", "db_view/compare"]
github-distribution = ["github-updates", "github-marketplace"]
github-marketplace = ["extension-runtime/github-marketplace"]
github-updates = []
wasm-components = ["extension-runtime/wasm-components"]

[lints]
workspace = true
