    zh-CN: 将远端 X11 图形应用转发到本机 X server（如 macOS 上的 XQuartz）显示。对新开的终端会话生效。
    zh-HK: 將遠端 X11 圖形應用轉發到本機 X server（如 macOS 上的 XQuartz）顯示。對新開的終端工作階段生效。
