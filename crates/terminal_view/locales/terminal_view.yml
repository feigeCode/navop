  uninstalling_shell_integration:
    en: Cleaning up...
    zh-CN: 清理中...
    zh-HK: 清理中...
  uninstall_shell_integration_desc:
    en: Shell integration is injected at runtime for every session and never writes files to the remote host. Older Navop versions may have left persistent integration files (rc blocks and ~/.config/onetcli) behind; click once to clean them up if you no longer use that version.
    zh-CN: Shell 集成在每次连接时运行时注入，不会在远端写入任何文件。旧版本 Navop 可能遗留过持久化集成文件（rc 配置块和 ~/.config/onetcli），如已不再使用旧版，可点击清理一次。
