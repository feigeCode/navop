    en: X11 forwarding is unavailable because XQuartz is not installed, not running, or its DISPLAY authorization is not ready. Install or start XQuartz, then reconnect the SSH session.
    zh-CN: X11 转发不可用：XQuartz 可能未安装、未运行，或 DISPLAY 授权尚未就绪。请安装或启动 XQuartz，然后重新建立 SSH 连接。
    zh-HK: X11 轉發無法使用：XQuartz 可能未安裝、未執行，或 DISPLAY 授權尚未就緒。請安裝或啟動 XQuartz，然後重新建立 SSH 連線。
