    zh-HK: "Expect 是比對伺服器輸出的正規表示式。明確填寫的傳送內容優先；傳送內容為空時，Navop 會依據 Expect 識別使用者名稱或密碼提示，並使用引用鑰匙圈中的對應值。傳送內容不以 \\r 或 \\n 結尾時會自動補回車。"
