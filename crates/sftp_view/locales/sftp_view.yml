    zh-CN: "传输路径："
    zh-HK: "傳輸路徑："
  direct_copy_item_count:
    en: "%{count} top-level item(s) will be copied."
    zh-CN: "将复制 %{count} 个顶层项目。"
    zh-HK: "將複製 %{count} 個頂層項目。"
  direct_copy_navop_source_auth:
    en: "Navop → source connection authentication: %{auth}"
    zh-CN: "Navop → 源服务器连接认证：%{auth}"
    zh-HK: "Navop → 來源伺服器連線認證：%{auth}"
  direct_copy_navop_target_auth:
    en: "Navop → target/relay connection authentication: %{auth}"
    zh-CN: "Navop → 目标服务器/本机中转连接认证：%{auth}"
    zh-HK: "Navop → 目標伺服器/本機中轉連線認證：%{auth}"
  direct_copy_server_auth_heading:
    en: "Direct transfer (%{strategy})"
    zh-CN: "直接传输（%{strategy}）"
    zh-HK: "直接傳輸（%{strategy}）"
  direct_copy_auth_boundary:
    en: "The source server connects to the target. File data does not pass through this computer."
    zh-CN: "由源服务器连接目标服务器，文件数据不经过本机。"
    zh-HK: "由來源伺服器連線目標伺服器，檔案資料不經過本機。"
  direct_copy_target_password_detail:
    en: "Navop will send the configured target password through the existing encrypted SSH connection to a permission-restricted temporary askpass credential on the source server."
    zh-CN: "Navop 会通过当前已加密的 SSH 连接，将已配置的目标服务器密码发送到源服务器上权限受限的临时 askpass 凭据文件。"
    zh-HK: "Navop 會透過目前已加密的 SSH 連線，將已設定的目標伺服器密碼傳送到來源伺服器上權限受限的臨時 askpass 憑證檔案。"
  direct_copy_target_private_key_file_detail:
    en: "Navop will read the configured private-key file locally, send its bytes through the encrypted SSH connection, and create a temporary mode-0600 identity file on the source server."
    zh-CN: "Navop 会在本机读取已配置的私钥文件，通过加密 SSH 连接发送私钥字节，并在源服务器创建权限为 0600 的临时身份文件。"
    zh-HK: "Navop 會在本機讀取已設定的私鑰檔案，透過加密 SSH 連線傳送私鑰位元組，並在來源伺服器建立權限為 0600 的臨時身分檔案。"
  direct_copy_target_private_key_content_detail:
    en: "Navop will send the stored private-key content through the encrypted SSH connection and create a temporary mode-0600 identity file on the source server."
    zh-CN: "Navop 会通过加密 SSH 连接发送已保存的私钥内容，并在源服务器创建权限为 0600 的临时身份文件。"
    zh-HK: "Navop 會透過加密 SSH 連線傳送已儲存的私鑰內容，並在來源伺服器建立權限為 0600 的臨時身分檔案。"
  direct_copy_target_passphrase_detail:
    en: "The configured private-key passphrase will be supplied through the same protected temporary askpass mechanism."
    zh-CN: "已配置的私钥口令将通过同一套受保护的临时 askpass 机制提供。"
    zh-HK: "已設定的私鑰口令將透過同一套受保護的臨時 askpass 機制提供。"
  direct_copy_target_certificate_detail:
    en: "The configured SSH certificate will also be sent and stored temporarily with mode 0600."
    zh-CN: "已配置的 SSH 证书也会被发送，并以 0600 权限临时保存。"
    zh-HK: "已設定的 SSH 憑證也會被傳送，並以 0600 權限臨時儲存。"
  direct_copy_target_agent_detail:
    en: "Navop will not forward its local SSH agent. The source server will use only an identity or SSH agent already available on that server."
    zh-CN: "Navop 不会转发本机 SSH Agent；源服务器只会使用其自身已有的身份文件或 SSH Agent。"
    zh-HK: "Navop 不會轉發本機 SSH Agent；來源伺服器只會使用其自身已有的身分檔案或 SSH Agent。"
  direct_copy_target_auto_key_detail:
    en: "The source server will use only its own OpenSSH default identities or SSH agent; no Navop credential is sent for this authentication mode."
    zh-CN: "源服务器只会使用其自身 OpenSSH 默认身份或 SSH Agent；此认证方式不会发送 Navop 凭据。"
    zh-HK: "來源伺服器只會使用其自身 OpenSSH 預設身分或 SSH Agent；此驗證方式不會傳送 Navop 憑證。"
  direct_copy_security:
    en: "The configured target authentication is provided temporarily to the source server. The target host key is pinned to the key already verified by Navop."
    zh-CN: "已配置的目标认证会临时提供给源服务器；目标主机密钥使用 Navop 已验证的密钥进行校验。"
    zh-HK: "已設定的目標驗證會暫時提供給來源伺服器；目標主機金鑰使用 Navop 已驗證的金鑰進行校驗。"
  direct_copy_navop_relay_heading:
    en: Through Navop
    zh-CN: 通过 Navop
    zh-HK: 透過 Navop
  direct_copy_navop_relay_detail:
    en: "Navop connects to both servers and relays file data through this computer. Credentials are not provided to the other server."
    zh-CN: "由 Navop 连接两台服务器，并通过本机中转文件数据；认证信息不会提供给另一台服务器。"
    zh-HK: "由 Navop 連線兩台伺服器，並透過本機中轉檔案資料；驗證資訊不會提供給另一台伺服器。"
  direct_copy_prompt:
    en: "Choose source-server direct transfer only if you permit the authentication behavior described above. Otherwise choose transfer through Navop or cancel."
    zh-CN: "只有在你允许上述认证行为时才选择源服务器直传；否则请选择通过 Navop 本机中转，或取消本次复制。"
    zh-HK: "只有在你允許上述驗證行為時才選擇來源伺服器直傳；否則請選擇透過 Navop 本機中轉，或取消本次複製。"
  direct_copy_use_direct:
