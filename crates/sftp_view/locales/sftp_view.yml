# SSH 主机密钥确认
HostKey:
  title:
    en: Verify SSH Host Key
    zh-CN: 验证 SSH 主机指纹
    zh-HK: 驗證 SSH 主機指紋
  message:
    en: This server is not yet trusted. Verify the fingerprint before continuing.
    zh-CN: 尚未信任此服务器。继续前请核对主机指纹。
    zh-HK: 尚未信任此伺服器。繼續前請核對主機指紋。
  changed_title:
    en: SSH Host Key Changed
    zh-CN: SSH 主机指纹已变更
    zh-HK: SSH 主機指紋已變更
  changed_message:
    en: The server presented a different host key. This can happen after reinstalling the server or rotating its keys, but it may also indicate a man-in-the-middle attack. Verify the new fingerprint through a trusted channel before continuing.
    zh-CN: 服务器提供了与之前不同的主机指纹。这可能由系统重装或密钥轮换引起，也可能意味着遭到中间人攻击。继续前请通过可信渠道核对新指纹。
    zh-HK: 伺服器提供了與之前不同的主機指紋。這可能由系統重裝或金鑰輪換引起，也可能表示遭到中間人攻擊。繼續前請透過可信渠道核對新指紋。
