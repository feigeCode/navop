[package]
name = "navop_runtime"
version = "0.15.2"
publish.workspace = true
edition.workspace = true

[dependencies]
db = { workspace = true, optional = true }
futures = { workspace = true }
one-core = { workspace = true }
runtime_core = { workspace = true }
runtime_database = { workspace = true, optional = true }
runtime_redis = { workspace = true, optional = true }
runtime_sftp = { workspace = true, optional = true }
serde_json = { workspace = true }
tool_runtime = { workspace = true }

[features]
default = ["database", "redis", "sftp"]
database = ["dep:db", "dep:runtime_database"]
redis = ["dep:runtime_redis"]
sftp = ["dep:runtime_sftp"]
builtin-duckdb = ["database", "db/builtin-duckdb"]

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true }

[lints]
workspace = true
