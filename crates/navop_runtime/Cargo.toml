[package]
name = "navop_runtime"
version = "0.15.2"
publish.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
agent_runtime = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
db = { workspace = true, optional = true }
futures = { workspace = true }
one-core = { workspace = true }
redis-runtime = { workspace = true, optional = true }
serde_json = { workspace = true }
sftp = { workspace = true, optional = true }
ssh = { workspace = true, optional = true }
tool_runtime = { workspace = true }

[features]
default = ["database", "redis", "sftp"]
database = ["dep:db"]
redis = ["dep:redis-runtime"]
sftp = ["dep:sftp", "dep:ssh"]
builtin-duckdb = ["database", "db/builtin-duckdb"]

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true }

[lints]
workspace = true
