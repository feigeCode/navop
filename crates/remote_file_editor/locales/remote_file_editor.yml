_version: 2

RemoteFileEditor:
  title:
    en: "Edit %{name}"
    zh-CN: "编辑 %{name}"
    zh-HK: "編輯 %{name}"
  action:
    save:
      en: Save
      zh-CN: 保存
      zh-HK: 儲存
    search:
      en: Search
      zh-CN: 搜索
      zh-HK: 搜索
    replace:
      en: Replace
      zh-CN: 替换
      zh-HK: 取代
    reload:
      en: Reload
      zh-CN: 重新加载
      zh-HK: 重新載入
    soft_wrap:
      en: Soft Wrap
      zh-CN: 自动换行
      zh-HK: 自動換行
    close_tab:
      en: Close Tab
      zh-CN: 关闭页签
      zh-HK: 關閉頁籤
    discard:
      en: Discard
      zh-CN: 放弃更改
      zh-HK: 放棄更改
    cancel:
      en: Cancel
      zh-CN: 取消
      zh-HK: 取消
    edit_with:
      en: "Edit With %{editor}"
      zh-CN: "使用 %{editor} 编辑"
      zh-HK: "使用 %{editor} 編輯"
    overwrite_remote:
      en: Overwrite Remote
      zh-CN: 覆盖远程文件
      zh-HK: 覆蓋遠端檔案
    reload_remote:
      en: Reload Remote
      zh-CN: 重新加载远程文件
      zh-HK: 重新載入遠端檔案
    launch:
      en: Launch
      zh-CN: 启动
      zh-HK: 啟動
  status:
    loading:
      en: Loading...
      zh-CN: 加载中...
      zh-HK: 載入中...
    load_failed:
      en: Load failed
      zh-CN: 加载失败
      zh-HK: 載入失敗
    loaded:
      en: Loaded
      zh-CN: 已加载
      zh-HK: 已載入
    loaded_plain_text:
      en: Loaded in plain text mode
      zh-CN: 已按纯文本模式加载
      zh-HK: 已按純文字模式載入
    saving:
      en: Saving...
      zh-CN: 保存中...
      zh-HK: 儲存中...
    saved:
      en: Saved
      zh-CN: 已保存
      zh-HK: 已儲存
    save_failed:
      en: Save failed
      zh-CN: 保存失败
      zh-HK: 儲存失敗
  state:
    modified:
      en: Modified
      zh-CN: 已修改
      zh-HK: 已修改
    saved:
      en: Saved
      zh-CN: 已保存
      zh-HK: 已儲存
  policy:
    code:
      en: Code
      zh-CN: 代码
      zh-HK: 程式碼
    plain_text:
      en: Plain Text
      zh-CN: 纯文本
      zh-HK: 純文字
  prompt:
    unsaved_title:
      en: This file has unsaved changes.
      zh-CN: 该文件有未保存的更改。
      zh-HK: 此檔案有未儲存的更改。
    unsaved_message:
      en: Choose Save to upload the latest changes before closing.
      zh-CN: 选择“保存”可在关闭前上传最新更改。
      zh-HK: 選擇「儲存」可在關閉前上傳最新更改。
    conflict_title:
      en: Remote file conflict
      zh-CN: 远程文件冲突
      zh-HK: 遠端檔案衝突
    remote_changed:
      en: The remote file changed after it was opened.
      zh-CN: 远程文件在打开后已被修改。
      zh-HK: 遠端檔案在打開後已被修改。
    remote_missing:
      en: The remote file was deleted after it was opened.
      zh-CN: 远程文件在打开后已被删除。
      zh-HK: 遠端檔案在打開後已被刪除。
    launch_title:
      en: Confirm external editor
      zh-CN: 确认外部编辑器
      zh-HK: 確認外部編輯器
    launch_message:
      en: "OnetCli will launch: %{program}"
      zh-CN: "OnetCli 将启动：%{program}"
      zh-HK: "OnetCli 將啟動：%{program}"
  notification:
    saved:
      en: Remote file saved
      zh-CN: 远程文件已保存
      zh-HK: 遠端檔案已儲存
    external_editor_missing:
      en: External editor is not installed
      zh-CN: 外部编辑器扩展未安装
      zh-HK: 外部編輯器擴充套件未安裝
    configure_program:
      en: Configure the external editor executable path first
      zh-CN: 请先配置外部编辑器可执行文件路径
      zh-HK: 請先設定外部編輯器可執行檔路徑
    external_uploaded:
      en: Remote file uploaded
      zh-CN: 远程文件已上传
      zh-HK: 遠端檔案已上傳
    external_reloaded:
      en: Remote file reloaded
      zh-CN: 已重新加载远程文件
      zh-HK: 已重新載入遠端檔案
  body:
    loading:
      en: Loading remote file...
      zh-CN: 正在加载远程文件...
      zh-HK: 正在載入遠端檔案...
    unable_to_open:
      en: Unable to open file
      zh-CN: 无法打开文件
      zh-HK: 無法打開檔案
