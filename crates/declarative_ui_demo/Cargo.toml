[package]
name = "declarative-ui-demo"
version = "0.1.0"
description = "Standalone restricted-HTML declarative UI runtime for GPUI"
readme = "README.md"
publish.workspace = true
edition.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui_platform.workspace = true
html5ever = "0.27"
markup5ever_rcdom = "0.3.0"
# Feature-unification shim for `gpui-component-assets`' `#[include = ...]` derive.
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
