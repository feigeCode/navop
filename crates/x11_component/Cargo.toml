[package]
name = "x11_component"
version = "0.1.0"
publish.workspace = true
edition.workspace = true

[features]
# 把官方固定组件 zip 在构建期内嵌进二进制（离线可用）。默认关闭：
# 组件分发策略未定期间，发布构建不再内嵌；需要时显式开启
# `--features x11_component/bundled`（产品侧用 `<产品>/x11-bundled` 转发）。
bundled = []

[dependencies]
base64.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
fs2.workspace = true
hex.workspace = true
libc.workspace = true
process-util.workspace = true
rand.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo = { workspace = true, features = ["system"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process"] }
tracing.workspace = true
x11_forwarding.workspace = true
zip.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
libloading.workspace = true

[dev-dependencies]

[lints]
workspace = true
