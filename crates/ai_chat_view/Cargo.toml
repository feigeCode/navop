[package]
name = "ai_chat_view"
version = "0.15.2"
publish.workspace = true
edition.workspace = true

[features]
default = ["embedded-webview"]
embedded-webview = ["dep:gpui-wry", "dep:wry"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui.workspace = true
gpui-base.workspace = true
gpui-component.workspace = true
one-ui.workspace = true
one-core.workspace = true
agent_runtime = { path = "../agent_runtime" }
html-preview.workspace = true
agent-client-protocol.workspace = true
llm-connector = { workspace = true, features = ["streaming"] }
async-trait.workspace = true
futures.workspace = true
smol.workspace = true
tokio.workspace = true
tracing.workspace = true
rust-i18n.workspace = true
base64.workspace = true
image.workspace = true
uuid.workspace = true
lsp-types.workspace = true
sum-tree.workspace = true
gpui-wry = { workspace = true, optional = true }
wry = { version = "0.53.3", package = "lb-wry", optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
palette.workspace = true

[[bin]]
name = "fake_acp_agent"
path = "tests/fixtures/fake_acp_agent.rs"
test = false
bench = false

[lints]
workspace = true
