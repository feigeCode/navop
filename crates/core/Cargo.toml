aes-gcm.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
ed25519-dalek = "2.2.0"
parking_lot.workspace = true
util.workspace = true
process-util.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
image.workspace = true
smallvec.workspace = true
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView", "NSWindow"] }
raw-window-handle = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
dotenvy = "0.15"

[features]
# `macos-touchbar-window-hide`：关闭窗口只 `orderOut` 隐藏原生窗口，**绝不销毁**。
#
# 带 Touch Bar 的 Mac 在销毁原生窗口时，AppKit 的 `_NSTouchBarFinder` 会在下一个显示
# 周期里去注销一个已经 dealloc 的对象的 KVO 观察，抛出的 ObjC 异常无人接住 ⇒
# `EXC_CRASH (SIGABRT)` 闪退（navop#262 / #308 / #314，上游 zed#64819）。把「关闭」换成
# 「隐藏」可以从根上绕开这条路径，完整背景见 `docs/macos-memory-investigation.md` §10。
#
# **当前没有任何构建打开它**：上游 zed#65186 修掉了根因（accesskit 不再动态替换内容视图
# 的类，改用普通 Adapter），该修复随 gpui-pre fork-0.3.124 进来，所以关闭窗口回到
# `remove_window()`。整套机制原样保留，作为随时可重开的回退开关。
#
# 代价写在明处：被隐藏的原生窗口会一直占着 NSWindow / CAMetalLayer，直到进程退出。
#
# 需要重新打开时（上游修复在真机上被否证），按「已复现的机型 / 构建」给对应 target 传这个
# feature 即可，代码不用改 —— 判据里没有架构条件（只有 `target_os = "macos"` + 这个
# feature）：
# `cargo build --release -p main --target x86_64-apple-darwin --features macos-touchbar-window-hide`。
# 未开启时所有隐藏路径都退回「关闭即销毁」，开关收敛在
# `crate::window_close::HIDE_WINDOWS_ON_CLOSE` 一个常量上。
default = []
macos-touchbar-window-hide = []
