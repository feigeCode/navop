_version: 2

Notes:
  title:
    en: Notes
    zh-CN: 笔记
    zh-HK: 筆記
  markdown_source:
    en: Source
    zh-CN: 源码
    zh-HK: 原始碼
  markdown_confirm_adjustment:
    en: Confirm changes and edit
    zh-CN: 确认调整并编辑
    zh-HK: 確認調整並編輯
