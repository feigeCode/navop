    zh-CN: 当前钥匙串条目已不再包含私钥密码。
    zh-HK: 目前鑰匙圈項目已不再包含私鑰密碼。
  unavailable:
    en: "Unavailable keychain item #%{id}"
    zh-CN: "不可用的钥匙串条目 #%{id}"
    zh-HK: "不可用的鑰匙圈項目 #%{id}"
  item_label:
    en: "%{name}"
    zh-CN: "%{name}"
    zh-HK: "%{name}"
  load_failed:
    en: Unable to load the keychain. Try again later.
    zh-CN: 无法加载钥匙串列表，请稍后重试。
    zh-HK: 無法載入鑰匙圈清單，請稍後再試。
