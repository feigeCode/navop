_version: 2

TeamSync:
  personal:
    en: Personal
    zh-CN: 个人
    zh-HK: 個人
  team_label:
    en: Team
    zh-CN: 团队归属
    zh-HK: 團隊歸屬
  refresh_tooltip:
    en: Refresh teams
    zh-CN: 刷新团队列表
    zh-HK: 重新整理團隊列表
