[package]
name = "universal-plugins"
version = "0.16.1"
publish.workspace = true
edition.workspace = true

[dependencies]
one-assets = { workspace = true }
agent_runtime = { workspace = true }
tool_runtime = { workspace = true }
ai_chat_view = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
connection-form.workspace = true
dirs.workspace = true
extension-host.workspace = true
extension-plugin-adapter.workspace = true
extension-protocol.workspace = true
extension-runtime.workspace = true
extension_view.workspace = true
gpui.workspace = true
gpui-component.workspace = true
nsh-platform-gpui = { workspace = true, optional = true }
# 页面 bundle 的能力声明（能力白名单）走 nsh-core 的 Capabilities 解析；
# nsh-platform-gpui 没有重导出它。
nsh-core = { workspace = true, optional = true }
nsh-engine = { workspace = true, optional = true }
one-core.workspace = true
one-ui = { workspace = true, optional = true }
rust-i18n.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
smol.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[features]
default = []
# 扩展页面的 UI 平面：nsh 宿主（AppView）。扩展页面以 nsh 程序运行，
# 画在 navop 的 GPUI 窗口里，方案见
# docs/extension-resource-plugins/nsh-migration-plan.md。
nsh-host = [
    "dep:nsh-platform-gpui",
    "dep:nsh-core",
    "dep:nsh-engine",
    "dep:ai_chat_view",
    "dep:one-ui",
    "dep:serde",
]

[lints]
workspace = true
