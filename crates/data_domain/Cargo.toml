[package]
name = "data_domain"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# 与 `mongodb_view` 同名 feature 对齐：打开后使用内嵌驱动，不再从已安装驱动目录
# 构造原生驱动工厂（详见 `DataDomain::init`）。
builtin-mongodb = ["mongodb_view/builtin-mongodb"]

[dependencies]
anyhow.workspace = true
app_kit.workspace = true
base64.workspace = true
db.workspace = true
db_view.workspace = true
domain_api.workspace = true
extension-runtime = { workspace = true, default-features = false, features = ["database"] }
gpui-component.workspace = true
gpui.workspace = true
mcp_host.workspace = true
navop_runtime = { path = "../navop_runtime", default-features = false, features = ["database", "redis"] }
mongodb_view.workspace = true
mongodb-runtime.workspace = true
runtime_database.workspace = true
runtime_redis.workspace = true
one-core.workspace = true
one-ui.workspace = true
public_mcp.workspace = true
serde_json.workspace = true
tool_runtime.workspace = true
tracing.workspace = true
redis_view.workspace = true
