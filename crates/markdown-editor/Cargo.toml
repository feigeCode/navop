[package]
name = "markdown-editor"
version = "0.15.2"
publish.workspace = true
edition.workspace = true
license = "Apache-2.0"
autobins = false

[dependencies]
anyhow.workspace = true
cssparser = "0.37"
directories = "6"
futures.workspace = true
gpui.workspace = true
gpui-component = { workspace = true, features = ["tree-sitter-markdown"] }
one-ui.workspace = true
palette.workspace = true
ratex-layout = "0.1.9"
ratex-parser = "0.1.9"
ratex-svg = { version = "0.1.9", features = ["embed-fonts", "standalone"] }
ropey.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1"
unicode-segmentation = "1.13"
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# 仅测试使用:语言扩展(wasm 语法)加载走 extension-runtime,不再依赖 gpui-component 的已删除 API
extension-runtime.workspace = true
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
