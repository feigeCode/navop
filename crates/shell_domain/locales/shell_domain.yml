    zh-CN: 全选
    zh-HK: 全選
  clear_selection:
    en: Clear Selection
    zh-CN: 清除选择
    zh-HK: 清除選取
  empty:
    en: No session logs yet
    zh-CN: 暂无会话日志
    zh-HK: 尚無工作階段日誌
  empty_search:
    en: No matching session logs
    zh-CN: 没有匹配的会话日志
    zh-HK: 沒有相符的工作階段日誌
  source_help:
    en: ".cast is the source container for a static, read-only terminal history. Open it to scroll, select, copy, and search just like a terminal; TXT is a readable exported copy."
    zh-CN: ".cast 是静态只读终端历史的源文件。打开后可像终端一样滚动、选中、复制和搜索；TXT 是导出的可读副本。"
    zh-HK: ".cast 是靜態唯讀終端歷史的來源檔案。開啟後可像終端一樣捲動、選取、複製和搜尋；TXT 是匯出的可讀副本。"
  output_only_help:
    en: Automatic session logging records output only and never records keyboard input, reducing exposure of passwords, tokens, and one-time codes. Session logs have no playback timeline or replay controls.
    zh-CN: 自动会话日志只记录输出，绝不记录键盘输入，以减少密码、令牌和一次性验证码泄露风险。会话日志没有播放时间轴或回放控制。
    zh-HK: 自動工作階段日誌只記錄輸出，絕不記錄鍵盤輸入，以減少密碼、權杖和一次性驗證碼外洩風險。工作階段日誌沒有播放時間軸或回放控制。
