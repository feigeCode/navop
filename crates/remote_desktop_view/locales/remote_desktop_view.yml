_version: 2

RemoteDesktop:
  status_waiting_layout:
    en: Waiting for layout
    zh-CN: 等待窗口布局
    zh-HK: 等待視窗版面配置
  status_connecting:
    en: Connecting
    zh-CN: 连接中
    zh-HK: 連線中
  status_connected:
    en: Connected
    zh-CN: 已连接
    zh-HK: 已連線
  reconnect_notification:
    en: "%{protocol} disconnected: %{reason}. Reconnecting in %{seconds}s"
    zh-CN: "%{protocol} 连接已断开：%{reason}。将在 %{seconds} 秒后重新连接"
    zh-HK: "%{protocol} 連線已中斷：%{reason}。將於 %{seconds} 秒後重新連線"
  reconnect_notification_manual:
    en: "Reconnecting %{protocol} session"
    zh-CN: "正在重新连接 %{protocol} 会话"
    zh-HK: "正在重新連線 %{protocol} 工作階段"
  reconnect_reason_display_update:
    en: display update error
    zh-CN: 显示更新错误
    zh-HK: 顯示更新錯誤
  reconnect_reason_session_error:
    en: session error
    zh-CN: 会话错误
    zh-HK: 工作階段錯誤
  reconnect_reason_connection_lost:
    en: connection lost
    zh-CN: 连接丢失
    zh-HK: 連線遺失
  failure_authentication:
    en: Authentication failed. Check the username, password, and domain.
    zh-CN: 身份验证失败，请检查用户名、密码和域。
    zh-HK: 身份驗證失敗，請檢查使用者名稱、密碼和網域。
  failure_host_unreachable:
    en: Unable to connect to the remote host. Check the address, port, and network.
    zh-CN: 无法连接远程主机，请检查主机地址、端口和网络。
    zh-HK: 無法連線遠端主機，請檢查主機地址、連接埠和網路。
  failure_server_ended:
    en: The remote server ended the session.
    zh-CN: 远程服务器已结束当前会话。
    zh-HK: 遠端伺服器已結束目前的工作階段。
  failure_generic:
    en: Remote desktop connection failed. Check the connection settings and try again.
    zh-CN: 远程桌面连接失败，请检查连接配置后重试。
    zh-HK: 遠端桌面連線失敗，請檢查連線設定後重試。
  session_taken_over_notification:
    en: Another user connected to the remote server. This RDP session was disconnected and the tab was closed.
    zh-CN: 另一位用户已连接到远程服务器，当前 RDP 会话已断开，页签已自动关闭。
    zh-HK: 另一位使用者已連線至遠端伺服器，目前的 RDP 工作階段已中斷，頁籤已自動關閉。
  vnc_clipboard_ascii_only:
    en: VNC clipboard currently supports ASCII text only
    zh-CN: VNC 剪贴板当前仅支持 ASCII 文本
    zh-HK: VNC 剪貼簿目前僅支援 ASCII 文字
  clipboard_files_received:
    en: "Received %{count} item(s) from the remote clipboard"
    zh-CN: "已从远端剪贴板接收 %{count} 个项目"
    zh-HK: "已從遠端剪貼簿接收 %{count} 個項目"
  clipboard_transfer_failed:
    en: Remote clipboard file transfer failed
    zh-CN: 远端剪贴板文件传输失败
    zh-HK: 遠端剪貼簿檔案傳輸失敗
  clipboard_files_invalid:
    en: Rejected unsafe remote clipboard files
    zh-CN: 已拒绝不安全的远端剪贴板文件
    zh-HK: 已拒絕不安全的遠端剪貼簿檔案
  provider_version_too_old:
    en: "%{protocol} provider version %{installed} is too old. Please update the provider to %{required} or newer."
    zh-CN: "%{protocol} 扩展版本 %{installed} 过低，请更新到 %{required} 或更高版本。"
    zh-HK: "%{protocol} 擴展版本 %{installed} 過低，請更新到 %{required} 或更高版本。"
  provider_version_invalid:
    en: "%{protocol} provider version %{installed} is invalid. Please update the provider to %{required} or newer."
    zh-CN: "%{protocol} 扩展版本 %{installed} 无效，请更新到 %{required} 或更高版本。"
    zh-HK: "%{protocol} 擴展版本 %{installed} 無效，請更新到 %{required} 或更高版本。"


