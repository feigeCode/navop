[package]
name = "remote_desktop_view"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
connection-form = { workspace = true }
one-core = { workspace = true }
one-ui = { workspace = true }
remote_desktop = { workspace = true }
windows_rdp_host = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
smallvec = { workspace = true }
rust-i18n = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"

[dev-dependencies]
tempfile = "3"

[features]
default = []
windows-native-rdp = ["dep:raw-window-handle", "dep:windows_rdp_host"]

[lints]
workspace = true
