    zh-CN: 下载失败，请重试。
    zh-HK: 下載失敗，請重試。
  apply_failed:
    en: Update failed. Please try again later.
    zh-CN: 更新失败，请稍后重试。
    zh-HK: 更新失敗，請稍後重試。
  error_prefix:
    en: Error
    zh-CN: 错误
    zh-HK: 錯誤
  missing_download_url:
    en: Download URL is missing. The update cannot continue.
    zh-CN: 缺少下载地址，无法更新。
    zh-HK: 缺少下載地址，無法更新。
  missing_download_file:
    en: Downloaded file was not found. Please download the update again.
    zh-CN: 未找到下载文件，请重新下载后再更新。
    zh-HK: 未找到下載文件，請重新下載後再更新。
  downloading_blocked:
    en: Update download is in progress. Please close this later.
    zh-CN: 正在下载更新，请稍后关闭。
    zh-HK: 正在下載更新，請稍後關閉。
  network_check_failed:
    en: Network check failed
    zh-CN: 网络检查失败
    zh-HK: 網絡檢查失敗
  network_unreachable:
    en: Unable to connect to the update server. Please check your network connection.
    zh-CN: 无法连接到更新服务器，请检查网络连接。
    zh-HK: 無法連接到更新伺服器，請檢查網絡連接。
  github_service_unavailable:
    en: GitHub service is temporarily unavailable, please try again later.
    zh-CN: GitHub 服务暂时不可用，请稍后重试。
    zh-HK: GitHub 服務暫時不可用，請稍後重試。
  already_up_to_date:
    en: You are already on the latest version.
    zh-CN: 当前已经是最新版本。
    zh-HK: 當前已經是最新版本。
  check_failed:
    en: Update check failed
    zh-CN: 检查更新失败
    zh-HK: 檢查更新失敗
  check_timeout:
    en: Update check timed out. Please try again later.
    zh-CN: 检查更新超时，请稍后重试。
    zh-HK: 檢查更新超時，請稍後重試。
  open_release_page:
    en: Open release page to download manually
    zh-CN: 打开发布页面手动下载
    zh-HK: 打開發布頁面手動下載

