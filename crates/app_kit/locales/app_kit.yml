    zh-CN: 下载失败，请重试。
    zh-HK: 下載失敗，請重試。
  apply_failed:
    en: Update failed. Please try again later.
    zh-CN: 更新失败，请稍后重试。
    zh-HK: 更新失敗，請稍後重試。
  error_prefix:
    en: Error
    zh-CN: 错误
    zh-HK: 錯誤
