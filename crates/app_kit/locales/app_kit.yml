    en: Download URL is missing. The update cannot continue.
    zh-CN: 缺少下载地址，无法更新。
    zh-HK: 缺少下載地址，無法更新。
  missing_download_file:
    en: Downloaded file was not found. Please download the update again.
    zh-CN: 未找到下载文件，请重新下载后再更新。
    zh-HK: 未找到下載文件，請重新下載後再更新。
  downloading_blocked:
    en: Update download is in progress. Please close this later.
    zh-CN: 正在下载更新，请稍后关闭。
    zh-HK: 正在下載更新，請稍後關閉。
